<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Contributions 3D</title>
<meta name="description" content="Altay Abdurakhim's GitHub contributions as an interactive 3D city — rotate, zoom and pick any date range.">
<style>
  :root {
    --bg: #000; --panel: rgba(28, 28, 30, 0.72); --line: rgba(255, 255, 255, 0.1);
    --text: #f5f5f7; --muted: #86868b; --blue: #2997ff;
    --ai: linear-gradient(90deg, #ff9f0a, #ff375f 35%, #bf5af2 70%, #0a84ff);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased; }
  canvas { display: block; touch-action: none; }
  .glass { background: var(--panel); border: 1px solid var(--line); border-radius: 22px;
    backdrop-filter: blur(24px) saturate(160%); -webkit-backdrop-filter: blur(24px) saturate(160%); }
  header { position: fixed; top: 16px; left: 16px; right: 16px; display: flex; gap: 12px; flex-wrap: wrap;
    align-items: flex-start; justify-content: space-between; pointer-events: none; }
  header > * { pointer-events: auto; }
  .title { padding: 16px 20px; }
  .eyebrow { font-size: 13px; font-weight: 600; background: var(--ai); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .total { font-size: 44px; font-weight: 700; letter-spacing: -1.5px; line-height: 1.05; margin-top: 2px; }
  .total small { font-size: 15px; font-weight: 500; color: var(--muted); letter-spacing: 0; margin-left: 6px; }
  .stats { display: flex; gap: 18px; margin-top: 10px; font-size: 13px; color: var(--muted); flex-wrap: wrap; }
  .stats b { display: block; color: var(--text); font-size: 17px; font-weight: 600; }
  .controls { padding: 12px; display: flex; flex-direction: column; gap: 10px; max-width: 100%; }
  .seg { display: flex; background: rgba(118, 118, 128, 0.24); border-radius: 12px; padding: 3px; overflow-x: auto; }
  .seg button { flex: 1; border: 0; background: transparent; color: var(--text); font: 600 13px/1 inherit; font-family: inherit;
    padding: 9px 12px; border-radius: 9px; cursor: pointer; white-space: nowrap; }
  .seg button.on { background: #636366; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35); }
  .dates { display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--muted); flex-wrap: wrap; }
  .dates input { background: rgba(118, 118, 128, 0.24); color: var(--text); border: 0; border-radius: 9px;
    padding: 8px 10px; font: 500 13px inherit; font-family: inherit; color-scheme: dark; }
  .row { display: flex; gap: 8px 14px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
  .toggle { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); cursor: pointer; user-select: none; }
  .switch { width: 42px; height: 26px; border-radius: 13px; background: rgba(118, 118, 128, 0.4); position: relative; transition: background .2s; }
  .switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 22px; height: 22px; border-radius: 50%; background: #fff; transition: transform .2s; }
  .toggle.on .switch { background: #30d158; }
  .toggle.on .switch::after { transform: translateX(16px); }
  .legend { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
  .legend i { width: 90px; height: 8px; border-radius: 4px; background: linear-gradient(90deg, #0a84ff 0 20%, #30d158 20% 40%, #ff3b30 40% 60%, #ffd60a 60% 80%, #f2f2f7 80%); }
  footer { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); padding: 10px 16px; font-size: 13px;
    color: var(--muted); white-space: nowrap; }
  footer a { color: var(--blue); text-decoration: none; }
  footer .long + span { display: none; }
  @media (max-width: 640px) { footer .long + span { display: inline; } }
  #daynight { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 8px;
    padding: 11px 18px; border-radius: 999px; color: var(--text); font: 600 14px/1 inherit; font-family: inherit; cursor: pointer; z-index: 3; }
  #daynight:hover { background: rgba(60, 60, 64, 0.8); }
  #dnIcon { font-size: 17px; }
  @media (max-width: 900px) { #daynight { top: auto; bottom: 64px; } }
  #tip { position: fixed; pointer-events: none; padding: 10px 14px; font-size: 13px; opacity: 0; transition: opacity .12s;
    transform: translate(-50%, calc(-100% - 14px)); white-space: nowrap; }
  #tip b { font-size: 15px; }
  #tower { position: fixed; left: 16px; top: 230px; width: 212px; padding: 10px 8px 8px; font-size: 13px; }
  #tower .thead { display: flex; justify-content: space-between; padding: 0 8px 6px; color: var(--muted); font-size: 11px; letter-spacing: .4px; text-transform: uppercase; }
  #tower .thead b { color: var(--text); }
  #order { list-style: none; margin: 0; padding: 0; overflow: hidden; }
  #order li { display: flex; align-items: center; gap: 8px; height: 22px; padding: 0 8px; border-radius: 7px; font-variant-numeric: tabular-nums; }
  #order li:nth-child(odd) { background: rgba(255, 255, 255, 0.05); }
  #order .pos { width: 18px; text-align: right; color: var(--muted); font-weight: 600; }
  #order i { width: 4px; height: 14px; border-radius: 2px; }
  #order .name { flex: 1; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #order .gap { color: var(--muted); }
  #order .pit { color: #000; background: #ffd60a; font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 5px; }
  #zoom { position: fixed; right: 16px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; align-items: center;
    gap: 6px; padding: 8px 6px; border-radius: 999px; }
  #zoom button { width: 32px; height: 32px; border: 0; border-radius: 50%; background: transparent; color: var(--text);
    font-size: 22px; font-weight: 500; line-height: 1; font-family: inherit; cursor: pointer; }
  #zoom button:hover { background: rgba(118, 118, 128, 0.3); }
  #zoom .rail { width: 32px; height: 200px; display: flex; align-items: center; justify-content: center; }
  #zbar { width: 200px; height: 20px; margin: 0; flex: none; transform: rotate(-90deg); cursor: pointer; -webkit-appearance: none; appearance: none; background: transparent; }
  #zbar::-webkit-slider-runnable-track { height: 4px; border-radius: 2px; background: rgba(255, 255, 255, 0.3); }
  #zbar::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; margin-top: -7px; border-radius: 50%; background: #f5f5f7; box-shadow: 0 1px 4px rgba(0, 0, 0, 0.4); }
  #zbar::-moz-range-track { height: 4px; border-radius: 2px; background: rgba(255, 255, 255, 0.3); }
  #zbar::-moz-range-thumb { width: 18px; height: 18px; border: 0; border-radius: 50%; background: #f5f5f7; }
  #msg { position: fixed; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: 15px; }
  @media (max-width: 640px) {
    header { top: 10px; left: 10px; right: 10px; }
    .title { padding: 12px 16px; width: 100%; }
    .total { font-size: 34px; }
    .controls { width: 100%; padding: 10px; gap: 8px; }
    .seg button { padding: 8px 6px; font-size: 12px; }
    .stats { gap: 12px; }
    footer { font-size: 12px; bottom: 10px; }
    footer .long { display: none; }
    .legend { display: none; }
    #tower { top: auto !important; bottom: 108px; left: 10px; width: 190px; }
    #order li:nth-child(n+4) { display: none; }
    #zoom { right: 10px; } #zoom .rail { height: 140px; } #zbar { width: 140px; }
  }
</style>
</head>
<body>
<div id="msg">Loading contributions…</div>
<header>
  <div class="glass title">
    <div class="eyebrow">Altay Abdurakhim · Contributions in 3D</div>
    <div class="total"><span id="total">0</span><small id="range"></small></div>
    <div class="stats">
      <div><b id="active">0</b>active days</div>
      <div><b id="best">0</b>best day</div>
      <div><b id="streak">0</b>longest streak</div>
    </div>
  </div>
  <div class="glass controls">
    <div class="seg" id="presets"></div>
    <div class="seg" id="years"></div>
    <div class="dates">From <input type="date" id="from"> to <input type="date" id="to"></div>
    <div class="row">
      <div class="toggle on" id="spin"><span class="switch"></span>Auto-rotate</div>
      <div class="legend">Less <i></i> More</div>
    </div>
  </div>
</header>
<button class="glass" id="daynight" type="button" aria-label="Day or night"><span id="dnIcon">🌙</span><span id="dnText">Night</span></button>
<div class="glass" id="tip"></div>
<div class="glass" id="zoom"><button id="zin" type="button" aria-label="Zoom in">+</button><div class="rail"><input type="range" id="zbar" min="0" max="1000" value="500" aria-label="Zoom"></div><button id="zout" type="button" aria-label="Zoom out">−</button></div>
<div class="glass" id="tower"><div class="thead"><b>Lap <span id="lap">1</span></b><span>Interval</span></div><ol id="order"></ol></div>
<footer class="glass"><span class="long">Drag to rotate · Scroll or pinch to zoom · Right-drag to move · </span><span>Drag · pinch · two fingers to move · </span><a href="https://github.com/Doosi41">@Doosi41</a></footer>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* Один день — одно здание. Чем больше коммитов, тем больше этажей. Крыша красится по «составу шин» (wet → hard).
   Дни без коммитов — лужайка или тротуар, а по части из них петляет трасса. Её главная прямая с питлейном — на юге. */
const CELL = 1.2, DAY = 86400000, FLOOR_H = 0.34, MAX_FLOORS = 14, MERGE_MIN = 6;
const STREET_Z = 1.5, STREET_X = 1.3, BLOCK_W = 4;      // ширина главной улицы и поперечных
const COMPOUNDS = ['#1a8fff', '#25e060', '#ff2d2d', '#ffe01a', '#ffffff'].map(c => new THREE.Color(c));   // wet, inter, soft, medium, hard
const $ = id => document.getElementById(id);
const iso = t => new Date(t).toISOString().slice(0, 10);
const parse = s => Date.parse(s + 'T00:00:00Z');
const fmt = (t, opts) => new Date(t).toLocaleDateString('en-US', { timeZone: 'UTC', ...opts });
const hash = (a, b = 0) => { let h = Math.imul(a ^ 0x9e3779b9, 0x85ebca6b) ^ Math.imul(b + 0x7f4a7c15, 0xc2b2ae35); h ^= h >>> 15; h = Math.imul(h, 0x2c1b3c6d); h ^= h >>> 12; return (h >>> 0) / 4294967296; };
const mix = (a, b, t) => a + (b - a) * t;

// ── сцена ──
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog('#070a16', 120, 520);
const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 2000);
const controls = new OrbitControls(camera, renderer.domElement);
Object.assign(controls, { enableDamping: true, dampingFactor: 0.08, autoRotate: true, autoRotateSpeed: 0.5,
  maxPolarAngle: Math.PI / 2.08, minDistance: 5, maxDistance: 320 });

const sky = new THREE.Mesh(new THREE.SphereGeometry(900, 48, 24), new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false,
  uniforms: { uNight: { value: 1 }, uSun: { value: new THREE.Vector3(0.5, 0.6, 0.4).normalize() } },
  vertexShader: 'varying vec3 vDir; void main(){ vDir = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
  fragmentShader: `
    varying vec3 vDir; uniform float uNight; uniform vec3 uSun;
    float h31(vec3 p){ p = fract(p * vec3(.1031, .1030, .0973)); p += dot(p, p.yxz + 33.33); return fract((p.x + p.y) * p.z); }
    void main(){
      vec3 d = normalize(vDir);
      float up = clamp(d.y, 0.0, 1.0);
      vec3 dayTop = vec3(0.16, 0.42, 0.86), dayHor = vec3(0.74, 0.86, 0.97);
      vec3 nightTop = vec3(0.004, 0.012, 0.045), nightHor = vec3(0.09, 0.11, 0.24);
      vec3 col = mix(mix(dayHor, dayTop, pow(up, 0.55)), mix(nightHor, nightTop, pow(up, 0.5)), uNight);
      float sd = max(dot(d, normalize(uSun)), 0.0);
      col += mix(vec3(1.0, 0.92, 0.7) * (pow(sd, 900.0) * 6.0 + pow(sd, 18.0) * 0.28), vec3(0.8, 0.88, 1.0) * (pow(sd, 1800.0) * 2.4 + pow(sd, 22.0) * 0.1), uNight);
      vec3 sp = floor(d * 380.0);
      float star = step(0.9965, h31(sp)) * smoothstep(0.08, 0.5, d.y);
      col += vec3(star) * uNight * (0.5 + 0.5 * h31(sp + 7.0));
      if (d.y < 0.0) col = mix(col, mix(vec3(0.3, 0.45, 0.3), vec3(0.02, 0.05, 0.04), uNight), smoothstep(0.0, -0.08, d.y));
      gl_FragColor = vec4(col, 1.0);
    }`,
}));
scene.add(sky);

const hemi = new THREE.HemisphereLight('#bfd8ff', '#44503e', 1);
const sun = new THREE.DirectionalLight('#fff1d6', 3);
sun.castShadow = true;
sun.shadow.mapSize.set(4096, 4096);
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.04;
scene.add(hemi, sun, sun.target);
const NIGHT = { exposure: 1.3, hemi: 0.95, sun: 1.2, fog: new THREE.Color('#070a16'), sunColor: new THREE.Color('#a8bfff'), hemiSky: new THREE.Color('#3a5090'), hemiGround: new THREE.Color('#0c0e16') };
const DAYS = { exposure: 1.0, hemi: 1.15, sun: 3.2, fog: new THREE.Color('#b9d3ee'), sunColor: new THREE.Color('#fff1d6'), hemiSky: new THREE.Color('#bfd8ff'), hemiGround: new THREE.Color('#4a5a40') };
const uNight = { value: 1 };   // общий uniform: свет в окнах и фонарях

// ── трава, асфальт, общие материалы ──
const grass = new THREE.Mesh(new THREE.CircleGeometry(900, 64), new THREE.MeshStandardMaterial({ color: '#3d7a38', roughness: 1 }));
grass.rotation.x = -Math.PI / 2; grass.position.y = -0.06; grass.receiveShadow = true;
scene.add(grass);
const asphaltMat = new THREE.MeshStandardMaterial({ color: '#2b2d33', roughness: 0.9 });
const trackMat = new THREE.MeshStandardMaterial({ color: '#2b2d33', roughness: 0.9, emissive: '#2a2f3a', emissiveIntensity: 0 });   // трасса ночью освещена
const kerbMat = new THREE.MeshStandardMaterial({ roughness: 0.6 });
kerbMat.onBeforeCompile = shader => {   // поребрики ночью светятся своим цветом
  shader.uniforms.uNight = uNight;
  shader.fragmentShader = shader.fragmentShader.replace('#include <common>', '#include <common>\nuniform float uNight;')
    .replace('#include <emissivemap_fragment>', '#include <emissivemap_fragment>\ntotalEmissiveRadiance += vColor * uNight * 0.45;');
};
kerbMat.customProgramCacheKey = () => 'kerbs';
const lineMat = new THREE.MeshStandardMaterial({ color: '#f1f1ee', roughness: 0.7 });
const roadFloor = new THREE.Mesh(new THREE.BoxGeometry(1, 0.04, 1), asphaltMat);
roadFloor.receiveShadow = true;
scene.add(roadFloor);

/* Окна рисуются в шейдере: сетка по граням, на ночь часть окон светится */
function windowMaterial(extra = {}) {
  const m = new THREE.MeshStandardMaterial({ roughness: 0.55, metalness: 0.1, ...extra });
  m.onBeforeCompile = shader => {
    shader.uniforms.uNight = uNight;
    shader.vertexShader = shader.vertexShader
      .replace('#include <common>', '#include <common>\nattribute float aFloors; attribute vec2 aCols; attribute float aSeed;\nvarying vec2 vUvW; varying float vFloorsW; varying vec2 vColsW; varying float vSeedW; varying vec3 vNrmW;')
      .replace('#include <begin_vertex>', '#include <begin_vertex>\nvUvW = uv; vFloorsW = aFloors; vColsW = aCols; vSeedW = aSeed; vNrmW = normal;');
    shader.fragmentShader = shader.fragmentShader
      .replace('#include <common>', '#include <common>\nuniform float uNight; varying vec2 vUvW; varying float vFloorsW; varying vec2 vColsW; varying float vSeedW; varying vec3 vNrmW;\nfloat h21(vec2 p){ p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }\nfloat band(float x, float a, float b, float w){ return smoothstep(a - w, a + w, x) * (1.0 - smoothstep(b - w, b + w, x)); }')
      .replace('#include <color_fragment>', `#include <color_fragment>
        float wall = step(abs(vNrmW.y), 0.5);
        float cols = abs(vNrmW.x) > 0.5 ? vColsW.y : vColsW.x;
        vec2 g = vec2(vUvW.x * cols, vUvW.y * vFloorsW);
        vec2 cl = floor(g), fr = fract(g);
        vec2 aa = clamp(fwidth(g) * 0.75, 0.0, 0.5);
        float win = band(fr.x, 0.2, 0.8, aa.x) * band(fr.y, 0.24, 0.76, aa.y) * wall * step(0.5, vFloorsW);
        win *= 1.0 - smoothstep(0.35, 0.5, max(aa.x, aa.y)) * 0.55;
        float face = vNrmW.x + 2.0 * vNrmW.z;
        float rnd = h21(cl + vec2(vSeedW * 13.7, face * 7.3 + 3.0));
        float winLit = win * step(0.5, rnd);
        vec3 glass = mix(vec3(0.34, 0.5, 0.68), vec3(0.03, 0.05, 0.09), uNight);
        diffuseColor.rgb = mix(diffuseColor.rgb, glass, win);`)
      .replace('#include <emissivemap_fragment>', `#include <emissivemap_fragment>
        totalEmissiveRadiance += winLit * uNight * mix(vec3(1.0, 0.76, 0.42), vec3(0.72, 0.86, 1.0), step(0.85, rnd)) * 1.35;`);
  };
  m.customProgramCacheKey = () => 'windows';
  return m;
}
const wallMat = windowMaterial();
const roofMat = new THREE.MeshStandardMaterial({ roughness: 0.6, metalness: 0.05 });
roofMat.onBeforeCompile = shader => {   // крыши слегка светятся своим цветом, чтобы состав резины читался и ночью
  shader.fragmentShader = shader.fragmentShader.replace('#include <emissivemap_fragment>', '#include <emissivemap_fragment>\ntotalEmissiveRadiance += vColor * 0.3;');
};
roofMat.customProgramCacheKey = () => 'roofs';

function instanced(geo, mat, n, { windows = false } = {}) {
  const g = geo.clone();
  if (windows) {
    g.setAttribute('aFloors', new THREE.InstancedBufferAttribute(new Float32Array(n), 1));
    g.setAttribute('aCols', new THREE.InstancedBufferAttribute(new Float32Array(n * 2), 2));
    g.setAttribute('aSeed', new THREE.InstancedBufferAttribute(new Float32Array(n), 1));
  }
  const m = new THREE.InstancedMesh(g, mat, Math.max(n, 1));
  m.count = n; m.castShadow = m.receiveShadow = true;
  const c = new THREE.Color('#ffffff');
  for (let i = 0; i < n; i++) m.setColorAt(i, c);
  return m;
}
const box = new THREE.BoxGeometry(1, 1, 1).translate(0, 0.5, 0);
function gableGeo() {   // призма-крыша, конёк вдоль z
  const s = new THREE.Shape(); s.moveTo(-0.5, 0); s.lineTo(0.5, 0); s.lineTo(0, 1); s.closePath();
  const g = new THREE.ExtrudeGeometry(s, { depth: 1, bevelEnabled: false });
  g.translate(0, 0, -0.5);
  return g;
}
const gable = gableGeo();
const cone = new THREE.ConeGeometry(0.5, 1, 7).translate(0, 0.5, 0);
const cyl = new THREE.CylinderGeometry(0.5, 0.5, 1, 10).translate(0, 0.5, 0);
const sphere = new THREE.SphereGeometry(0.5, 12, 8);

// ── надписи ──
function label(text, size = 0.55) {
  const c = document.createElement('canvas');
  c.width = 256; c.height = 64;
  const g = c.getContext('2d');
  g.font = '600 34px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
  g.fillStyle = '#e8e8ed'; g.textBaseline = 'middle'; g.shadowColor = 'rgba(0,0,0,.8)'; g.shadowBlur = 6;
  g.fillText(text, 4, 34);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: t, transparent: true, depthWrite: false, fog: false }));
  s.scale.set(size * 4, size, 1);
  return s;
}

// ── вертолёт на крыше самого высокого здания ──
function buildHelicopter() {
  const g = new THREE.Group();
  const red = new THREE.MeshStandardMaterial({ color: '#d3141f', roughness: 0.35, metalness: 0.4 });
  const dark = new THREE.MeshStandardMaterial({ color: '#16171a', roughness: 0.5, metalness: 0.5 });
  const glass = new THREE.MeshStandardMaterial({ color: '#27425e', roughness: 0.1, metalness: 0.2 });
  const part = (geo, mat, x, y, z, sx = 1, sy = 1, sz = 1) => { const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); m.scale.set(sx, sy, sz); m.castShadow = true; g.add(m); return m; };
  part(sphere, red, 0, 0.22, 0, 0.62, 0.38, 0.34);                         // фюзеляж
  part(sphere, glass, 0.18, 0.26, 0, 0.3, 0.26, 0.3);                      // кабина

    const toCorner = g.arc ? 0 : g.len - q.local, vtop = c.vmax * c.form;

      if (Math.abs(c.off - PIT_SIDE) < 0.35) {   // на въезде с нужной стороны - в боксы, иначе на следующем круге

    const want = Math.max(-limAhead, Math.min(limAhead, toPit < 14 ? PIT_SIDE : c.attack ? c.attack.side * Math.min(LANE, limAhead - 0.02) : lineOffset(c, q, g, lim)));

    if (Math.abs(c.off) > lim) c.off = Math.sign(c.off) * lim;   // за поребрик не выезжаем
    place(c, side / Math.max(dt, 1e-3));
  }
}

  const bays = Math.max(4, Math.min(12, Math.round(W / 6)));

    const stripe = new THREE.Mesh(box, new THREE.MeshStandardMaterial({ color: teams[i % teams.length], roughness: 0.4, emissive: teams[i % teams.length], emissiveIntensity: 0.25 })); stripe.scale.set(bayW - 0.12, 0.2, 0.04); stripe.position.set(x, 1.34, pitZ + pitDepth / 2 + 0.01); pitBuild.add(stripe);
    const door = new THREE.Mesh(box, doorMat); door.scale.set(bayW * 0.7, 0.85, 0.04); door.position.set(x, 0.12, pitZ + pitDepth / 2 + 0.01); pitBuild.add(door);
    const tireStack = instanced(new THREE.CylinderGeometry(0.17, 0.17, 0.12, 14).translate(0, 0.06, 0), new THREE.MeshStandardMaterial({ color: '#17171a', roughness: 0.9 }), 3);
    for (let j = 0; j < 3; j++) { dummy.rotation.set(0, 0, 0); dummy.position.set(x + bayW * 0.3, 0.05 + j * 0.13, pitZ + pitDepth / 2 + 0.22); dummy.scale.set(1, 1, 1); dummy.updateMatrix(); tireStack.setMatrixAt(j, dummy.matrix); }
    pitBuild.add(tireStack);
  }
  const wall = new THREE.Mesh(box, new THREE.MeshStandardMaterial({ color: '#c9cbd1', roughness: 0.8 })); wall.scale.set(xEast - xWest - 4, 0.28, 0.08); wall.position.set(0, 0, laneZ + laneW / 2 + 0.2); pitBuild.add(wall);
  const gantry = new THREE.Group();   // светофор на старте пит-лейна
  const beamG = new THREE.Mesh(box, new THREE.MeshStandardMaterial({ color: '#2a2c31', metalness: 0.5, roughness: 0.5 })); beamG.scale.set(1.8, 0.14, 0.14); beamG.position.set(0, 1.9, 0); gantry.add(beamG);
  for (const s of [-1, 1]) { const p = new THREE.Mesh(box, beamG.material); p.scale.set(0.12, 1.9, 0.12); p.position.set(s * 0.9, 0, 0); gantry.add(p); }
  for (let i = 0; i < 5; i++) { const l = new THREE.Mesh(sphere, new THREE.MeshStandardMaterial({ color: '#300', emissive: '#ff1a1a', emissiveIntensity: 1.8 })); l.scale.setScalar(0.15); l.position.set(-0.6 + i * 0.3, 1.78, 0.1); gantry.add(l); }
  gantry.position.set(-(bays * bayW) / 2 + 0.6, 0, laneZ - laneW / 2); pitBuild.add(gantry);
  pitBuild.userData.doorMat = doorMat;
  world.add(pitBuild);
  world.userData.doorMat = doorMat;
  setPit(xWest, xEast, laneZ, TEAMS.map((_, t) => -(bays * bayW) / 2 + bayW * (t % bays + 0.5)));   // болид встаёт у бокса своей команды
  const pitLabel = label('PIT LANE', 0.7); pitLabel.position.set(0, 1.9, pitZ + pitDepth / 2 + 0.4); world.add(pitLabel);

  // ── здания ──
  const nb = buildings.length;
  walls = instanced(box, wallMat, nb, { windows: true });
  const crowns2 = buildings.filter(b => b.type === 'tower' && !b.tallest);
  const gables = buildings.filter(b => b.type === 'hut' || b.type === 'house');
  const slabs = buildings.filter(b => b.type === 'mid' || b.type === 'tower');
  const roofGable = instanced(gable, roofMat, gables.length);
  const roofSlab = instanced(box, roofMat, slabs.length);
  const crowns3 = instanced(box, wallMat, crowns2.length, { windows: true });
  const antennas = instanced(cyl, new THREE.MeshStandardMaterial({ color: '#8d939c', metalness: 0.8, roughness: 0.3 }), crowns2.length);
  const tips = instanced(sphere, new THREE.MeshStandardMaterial({ color: '#400', emissive: '#ff2a2a', emissiveIntensity: 1.4 }), crowns2.length);
  tips.castShadow = false;
  buildings.forEach((b, i) => {
    walls.setColorAt(i, b.wall);
    const a = walls.geometry.attributes;
    a.aCols.setXY(i, b.cols[0], b.cols[1]); a.aSeed.setX(i, b.seed);
  });
  gables.forEach((b, i) => roofGable.setColorAt(i, b.roof));
  slabs.forEach((b, i) => roofSlab.setColorAt(i, b.roof));
  crowns2.forEach((b, i) => { crowns3.setColorAt(i, b.wall.clone().multiplyScalar(0.8)); const a = crowns3.geometry.attributes; a.aCols.setXY(i, 2, 2); a.aSeed.setX(i, b.seed + 0.37); });
  for (const m of [walls, crowns3]) { m.geometry.attributes.aCols.needsUpdate = true; m.geometry.attributes.aSeed.needsUpdate = true; }
  world.add(walls, roofGable, roofSlab, crowns3, antennas, tips);
  wallsData = { gables, slabs, crowns2, roofGable, roofSlab, crowns3, antennas, tips };

  // вертолётная площадка на самом высоком здании
  if (tallest) {
    const pad = (() => {
      const c = document.createElement('canvas'); c.width = c.height = 128;
      const g = c.getContext('2d');
      g.fillStyle = '#2d2f35'; g.fillRect(0, 0, 128, 128);
      g.strokeStyle = '#ffd60a'; g.lineWidth = 7; g.beginPath(); g.arc(64, 64, 54, 0, Math.PI * 2); g.stroke();
      g.fillStyle = '#ffd60a'; g.font = '800 70px sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('H', 64, 68);
      const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
      return new THREE.Mesh(new THREE.CircleGeometry(0.4, 40), new THREE.MeshStandardMaterial({ map: t, roughness: 0.8 }));
    })();
    pad.rotation.x = -Math.PI / 2;
    world.userData.pad = pad; pad.visible = false;
    world.add(pad);
    heli.visible = true;
  } else heli.visible = false;

  // ── подписи месяцев вдоль северного тротуара ──
  const labelSize = Math.max(0.6, weeks * 0.024);
  let month = -1, lastWeek = -9;
  for (const cell of cells) {
    const m = new Date(cell.t).getUTCMonth();
    if (m !== month && (cell.dow === 0 || cell === cells[0])) {
      month = m;
      if (cell.week - lastWeek < 3) continue;
      lastWeek = cell.week;
      const s = label(fmt(cell.t, weeks > 60 ? { month: 'short', year: '2-digit' } : { month: 'short' }), labelSize);
      s.position.set(cell.x + labelSize * 1.6, 0.3, -D / 2 - 0.9 - labelSize * 0.5);
      world.add(s);
    }
  }

  // ── дальний город по кругу + Marina Bay ──
  const R0 = Math.max(80, Math.max(W, D) / 2 + 85);
  const far = [];
  for (let i = 0; i < 260; i++) {
    const a = hash(i, 1) * Math.PI * 2, r = R0 + hash(i, 2) * 60 + (hash(i, 3) > 0.7 ? 40 : 0);
    const w = 3 + hash(i, 4) * 4, h = 8 + Math.pow(hash(i, 5), 2.4) * 32;
    far.push({ x: Math.cos(a) * r, z: Math.sin(a) * r, w, d: 3 + hash(i, 6) * 5, h, seed: hash(i, 7) });
  }
  const farMesh = instanced(box, wallMat, far.length, { windows: true });
  farMesh.castShadow = false; farMesh.receiveShadow = false;
  far.forEach((b, i) => {
    dummy.rotation.set(0, 0, 0); dummy.position.set(b.x, 0, b.z); dummy.scale.set(b.w, b.h, b.d); dummy.updateMatrix(); farMesh.setMatrixAt(i, dummy.matrix);
    farMesh.setColorAt(i, new THREE.Color().setHSL(0.58 + hash(i, 8) * 0.05, 0.18, 0.28 + hash(i, 9) * 0.18));
    const a = farMesh.geometry.attributes; a.aFloors.setX(i, Math.round(b.h / 1.0)); a.aCols.setXY(i, Math.round(b.w / 0.9), Math.round(b.d / 0.9)); a.aSeed.setX(i, b.seed);
  });
  world.add(farMesh);
  const mbsAt = new THREE.Vector3(-R0 * 0.55, 0, -R0 * 0.75);   // три башни с «кораблём» на крыше
  const mbsMesh = instanced(box, wallMat, 3, { windows: true });
  mbsMesh.castShadow = false;
  [-16, 0, 16].forEach((dx, i) => {
    dummy.rotation.set(0, 0, 0); dummy.position.set(mbsAt.x + dx, 0, mbsAt.z); dummy.scale.set(10, 55, 14); dummy.updateMatrix(); mbsMesh.setMatrixAt(i, dummy.matrix);
    mbsMesh.setColorAt(i, new THREE.Color('#5c6b82'));
    const a = mbsMesh.geometry.attributes; a.aFloors.setX(i, 55); a.aCols.setXY(i, 8, 10); a.aSeed.setX(i, i * 0.31);
  });
  const ship = new THREE.Mesh(box, new THREE.MeshStandardMaterial({ color: '#cfd5df', roughness: 0.5, metalness: 0.3 }));
  ship.scale.set(66, 3, 16); ship.position.set(mbsAt.x, 55, mbsAt.z);
  world.add(mbsMesh, ship);

  // ── свет, тень, камера ──
  const size = Math.max(W, D) / 2 + 12;
  sun.shadow.camera.left = -size; sun.shadow.camera.right = size; sun.shadow.camera.top = size; sun.shadow.camera.bottom = -size;
  sun.shadow.camera.near = 1; sun.shadow.camera.far = 400; sun.shadow.camera.updateProjectionMatrix();
  grass.visible = true;
  const dist = Math.max(18, Math.max(W, D) * 0.95);
  controls.target.set(0, 1, 2);
  camera.position.set(dist * 0.62, dist * 0.55, dist * 0.78);
  scene.userData.layout = { W, D, zSouth, R0 };
  applyNight(uNight.value);
  if (q.get('cam')) { const [cx, cy, cz] = q.get('cam').split(',').map(Number); camera.position.set(cx, cy, cz); controls.autoRotate = false; if (q.get('tgt')) controls.target.set(...q.get('tgt').split(',').map(Number)); }

  $('total').textContent = total.toLocaleString('en-US');
  $('range').textContent = `contributions · ${fmt(from, { month: 'short', day: 'numeric', year: 'numeric' })} – ${fmt(to, { month: 'short', day: 'numeric', year: 'numeric' })}`;
  $('active').textContent = active;
  $('best').textContent = best[0] ? `${best[0]} · ${fmt(best[1], { month: 'short', day: 'numeric' })}` : '0';
  $('streak').textContent = `${streak} ${streak === 1 ? 'day' : 'days'}`;
  $('from').value = iso(from); $('to').value = iso(to);
  history.replaceState(null, '', `?from=${iso(from)}&to=${iso(to)}`);
  anim = { start: performance.now(), weeks };
}

// ── день / ночь ──
function applyNight(n) {
  uNight.value = n; sky.material.uniforms.uNight.value = n;
  const sunDir = new THREE.Vector3().lerpVectors(new THREE.Vector3(0.55, 0.72, 0.42), new THREE.Vector3(-0.45, 0.62, -0.5), n).normalize();
  sky.material.uniforms.uSun.value.copy(sunDir);
  sun.position.copy(sunDir).multiplyScalar(120); sun.target.position.set(0, 0, 0);
  sun.intensity = mix(DAYS.sun, NIGHT.sun, n); sun.color.copy(DAYS.sunColor).lerp(NIGHT.sunColor, n);
  hemi.intensity = mix(DAYS.hemi, NIGHT.hemi, n); hemi.color.copy(DAYS.hemiSky).lerp(NIGHT.hemiSky, n); hemi.groundColor.copy(DAYS.hemiGround).lerp(NIGHT.hemiGround, n);
  renderer.toneMappingExposure = mix(DAYS.exposure, NIGHT.exposure, n);
  scene.fog.color.copy(DAYS.fog).lerp(NIGHT.fog, n);
  grass.material.color.set('#3d7a38').lerp(new THREE.Color('#14301e'), n);
  const bulbs = world.userData.bulbs, door = world.userData.doorMat;
  if (bulbs) bulbs.material.emissiveIntensity = n * 2.2;
  if (door) door.emissiveIntensity = n * 0.9;
  for (const c of cars) for (const m of c.mesh.userData.paint) m.emissiveIntensity = 0.12 + n * 0.5;   // днём чуть светится, чтобы цвет был сочнее
  trackMat.emissiveIntensity = n;
  lineMat.emissive.set('#ffffff'); lineMat.emissiveIntensity = n * 0.25;
  rainLightMat.emissiveIntensity = 2 + n * 2;
}
let nightTarget = 1;

// ── анимация роста: здания растут этаж за этажом ──
function grow(now) {
  if (!anim || !walls) return;
  let done = true;
  const { gables, slabs, crowns2, roofGable, roofSlab, crowns3, antennas, tips } = wallsData;
  const a = walls.geometry.attributes;
  buildings.forEach((b, i) => {
    const p = Math.min(Math.max((now - anim.start - b.ids[0] * 1.2 - cells[b.ids[0]].week * (900 / anim.weeks)) / 900, 0), 1);
    if (p < 1) done = false;
    const e = 1 - Math.pow(1 - p, 3), h = Math.max(b.H * e, 0.001);
    dummy.rotation.set(0, 0, 0);
    dummy.position.set(b.x, 0.05, b.z); dummy.scale.set(b.w, h, b.d); dummy.updateMatrix(); walls.setMatrixAt(i, dummy.matrix);
    a.aFloors.setX(i, b.floors * e);
    b.top = 0.05 + h; b.e = e;
  });
  gables.forEach((b, i) => {
    const rh = b.type === 'hut' ? 0.34 : 0.5;
    dummy.position.set(b.x, b.top, b.z); dummy.scale.set(b.w * 1.16, rh * b.e, b.d * 1.16); dummy.updateMatrix(); roofGable.setMatrixAt(i, dummy.matrix);
  });
  slabs.forEach((b, i) => {
    dummy.position.set(b.x, b.top, b.z); dummy.scale.set(b.w + 0.08, 0.07 * b.e, b.d + 0.08); dummy.updateMatrix(); roofSlab.setMatrixAt(i, dummy.matrix);
  });
  const ca = crowns3.geometry.attributes;
  crowns2.forEach((b, i) => {
    const ch = 0.55 * b.e, y = b.top + 0.07 * b.e;
    dummy.position.set(b.x, y, b.z); dummy.scale.set(b.w * 0.6, ch, b.merged ? b.d * 0.8 : b.d * 0.6); dummy.updateMatrix(); crowns3.setMatrixAt(i, dummy.matrix);
    ca.aFloors.setX(i, 2 * b.e);
    dummy.position.set(b.x, y + ch, b.z); dummy.scale.set(0.03, 0.8 * b.e, 0.03); dummy.updateMatrix(); antennas.setMatrixAt(i, dummy.matrix);
    dummy.position.set(b.x, y + ch + 0.8 * b.e, b.z); dummy.scale.set(0.07, 0.07, 0.07); dummy.updateMatrix(); tips.setMatrixAt(i, dummy.matrix);
  });
  for (const m of [walls, roofGable, roofSlab, crowns3, antennas, tips]) m.instanceMatrix.needsUpdate = true;
  a.aFloors.needsUpdate = true; ca.aFloors.needsUpdate = true;
  // вертолёт и площадка на самом высоком здании
  const t = buildings.find(b => b.tallest);
  if (t && world.userData.pad) {
    const pad = world.userData.pad, top = t.top + 0.075;
    pad.visible = true; pad.position.set(t.x, top, t.z);
    heli.position.set(t.x, top, t.z); heli.rotation.y = 0.5;
    dummy.position.set(t.x, t.top, t.z); dummy.scale.set(t.w + 0.08, 0.07 * t.e, t.d + 0.08); dummy.updateMatrix();
    const slabIndex = wallsData.slabs.indexOf(t);
    if (slabIndex >= 0) { roofSlab.setMatrixAt(slabIndex, dummy.matrix); roofSlab.instanceMatrix.needsUpdate = true; }
  }
  if (done) anim = null;
}

// ── элементы управления ──
const presets = [['All time', 0], ['1Y', 365], ['6M', 182], ['3M', 91], ['1M', 30]];
function select(group, button) { for (const b of document.querySelectorAll('.seg button')) b.classList.toggle('on', b === button); }
for (const [name, days] of presets) {
  const b = document.createElement('button');
  b.textContent = name;
  b.onclick = () => { select('p', b); build(days ? Math.max(first, last - (days - 1) * DAY) : first, last); };
  $('presets').append(b);
}
for (let y = new Date(first).getUTCFullYear(); y <= new Date(last).getUTCFullYear(); y++) {
  const b = document.createElement('button');
  b.textContent = y;
  b.onclick = () => { select('y', b); build(Math.max(first, Date.UTC(y, 0, 1)), Math.min(last, Date.UTC(y, 11, 31))); };
  $('years').append(b);
}
function custom() {
  let a = parse($('from').value), b = parse($('to').value);
  if (isNaN(a) || isNaN(b)) return;
  if (a > b) [a, b] = [b, a];
  select(null, null);
  build(Math.max(first, a), Math.min(last, b));
}
$('from').onchange = $('to').onchange = custom;
$('spin').onclick = () => { controls.autoRotate = !controls.autoRotate; $('spin').classList.toggle('on', controls.autoRotate); };
function dayNightLabel() { $('dnIcon').textContent = nightTarget ? '🌙' : '☀️'; $('dnText').textContent = nightTarget ? 'Night' : 'Day'; }
$('daynight').onclick = () => { nightTarget = nightTarget ? 0 : 1; dayNightLabel(); };
controls.addEventListener('start', () => { controls.autoRotate = false; $('spin').classList.remove('on'); });
// зум полоской сбоку: вверх - ближе; шкала логарифмическая, чтобы и издалека, и вблизи двигалась ровно
const zoomT = d => Math.log(controls.maxDistance / d) / Math.log(controls.maxDistance / controls.minDistance);
function zoomTo(d) {
  d = Math.min(controls.maxDistance, Math.max(controls.minDistance, d));
  camera.position.sub(controls.target).setLength(d).add(controls.target);
  controls.update();
}
$('zbar').oninput = () => zoomTo(controls.maxDistance * (controls.minDistance / controls.maxDistance) ** ($('zbar').value / 1000));
$('zin').onclick = () => zoomTo(camera.position.distanceTo(controls.target) / 1.4);
$('zout').onclick = () => zoomTo(camera.position.distanceTo(controls.target) * 1.4);
controls.addEventListener('change', () => { if (document.activeElement !== $('zbar')) $('zbar').value = Math.round(zoomT(camera.position.distanceTo(controls.target)) * 1000); });

const q = new URLSearchParams(location.search);
if (q.get('day') === '1') { uNight.value = 0; nightTarget = 0; }
dayNightLabel();
if (q.get('from') && q.get('to')) {
  $('from').value = q.get('from'); $('to').value = q.get('to'); custom();
} else {
  const b = $('presets').children[1];
  select('p', b);
  build(Math.max(first, last - 364 * DAY), last);
}

// ── подсказка при наведении ──
const ray = new THREE.Raycaster(), pointer = new THREE.Vector2();
function hover(e) {
  if (!walls) return;
  pointer.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(pointer, camera);
  const hit = ray.intersectObject(walls)[0];
  const id = hit ? hit.instanceId : -1;
  if (hovered !== -1 && hovered !== id && buildings[hovered]) walls.setColorAt(hovered, buildings[hovered].wall);
  if (id !== -1) {
    const b = buildings[id];
    walls.setColorAt(id, new THREE.Color('#ffffff'));
    const dates = b.ids.map(k => fmt(cells[k].t, { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' })).join(' + ');
    $('tip').innerHTML = `<b>${b.c} ${b.c === 1 ? 'contribution' : 'contributions'}</b> · ${b.floors} ${b.floors === 1 ? 'floor' : 'floors'}<br>${dates}`;
    Object.assign($('tip').style, { left: e.clientX + 'px', top: e.clientY + 'px', opacity: 1 });
  } else $('tip').style.opacity = 0;
  if (walls.instanceColor) walls.instanceColor.needsUpdate = true;
  hovered = id;
}
renderer.domElement.addEventListener('pointermove', hover);
renderer.domElement.addEventListener('pointerleave', () => { $('tip').style.opacity = 0; });

placeTower();
addEventListener('resize', () => {
  placeTower();
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
let lastT = performance.now();
renderer.setAnimationLoop(now => {
  const dt = Math.min((now - lastT) / 1000, 0.05); lastT = now;
  if (Math.abs(uNight.value - nightTarget) > 0.001) { applyNight(uNight.value + Math.sign(nightTarget - uNight.value) * Math.min(dt * 1.6, Math.abs(nightTarget - uNight.value))); }
  grow(now);
  race(dt);
  updateTower(dt);
  heli.userData.rotor.rotation.y += dt * 24; heli.userData.tail.rotation.x += dt * 30;
  sky.position.copy(camera.position);
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
