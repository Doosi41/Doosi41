<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Contributions 3D</title>
<meta name="description" content="Altay Abdurakhim's GitHub contributions as an interactive 3D city — rotate, zoom and pick any date range.">
<style>
  :root {
    --bg: #000; --panel: rgba(28, 28, 30, 0.72); --line: rgba(255, 255, 255, 0.1);
    --text: #f5f5f7; --muted: #86868b; --blue: #2997ff;
    --ai: linear-gradient(90deg, #ff9f0a, #ff375f 35%, #bf5af2 70%, #0a84ff);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased; }
  canvas { display: block; touch-action: none; }
  .glass { background: var(--panel); border: 1px solid var(--line); border-radius: 22px;
    backdrop-filter: blur(24px) saturate(160%); -webkit-backdrop-filter: blur(24px) saturate(160%); }
  header { position: fixed; top: 16px; left: 16px; right: 16px; display: flex; gap: 12px; flex-wrap: wrap;
    align-items: flex-start; justify-content: space-between; pointer-events: none; }
  header > * { pointer-events: auto; }
  .title { padding: 16px 20px; }
  .eyebrow { font-size: 13px; font-weight: 600; background: var(--ai); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .total { font-size: 44px; font-weight: 700; letter-spacing: -1.5px; line-height: 1.05; margin-top: 2px; }
  .total small { font-size: 15px; font-weight: 500; color: var(--muted); letter-spacing: 0; margin-left: 6px; }
  .stats { display: flex; gap: 18px; margin-top: 10px; font-size: 13px; color: var(--muted); flex-wrap: wrap; }
  .stats b { display: block; color: var(--text); font-size: 17px; font-weight: 600; }
  .controls { padding: 12px; display: flex; flex-direction: column; gap: 10px; max-width: 100%; }
  .seg { display: flex; background: rgba(118, 118, 128, 0.24); border-radius: 12px; padding: 3px; overflow-x: auto; }
  .seg button { flex: 1; border: 0; background: transparent; color: var(--text); font: 600 13px/1 inherit; font-family: inherit;
    padding: 9px 12px; border-radius: 9px; cursor: pointer; white-space: nowrap; }
  .seg button.on { background: #636366; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35); }
  .dates { display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--muted); flex-wrap: wrap; }
  .dates input { background: rgba(118, 118, 128, 0.24); color: var(--text); border: 0; border-radius: 9px;
    padding: 8px 10px; font: 500 13px inherit; font-family: inherit; color-scheme: dark; }
  .row { display: flex; gap: 8px 14px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
  .toggle { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); cursor: pointer; user-select: none; }
  .switch { width: 42px; height: 26px; border-radius: 13px; background: rgba(118, 118, 128, 0.4); position: relative; transition: background .2s; }
  .switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 22px; height: 22px; border-radius: 50%; background: #fff; transition: transform .2s; }
  .toggle.on .switch { background: #30d158; }
  .toggle.on .switch::after { transform: translateX(16px); }
  .legend { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
  .legend i { width: 90px; height: 8px; border-radius: 4px; background: linear-gradient(90deg, #0a84ff 0 20%, #30d158 20% 40%, #ff3b30 40% 60%, #ffd60a 60% 80%, #f2f2f7 80%); }
  footer { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); padding: 10px 16px; font-size: 13px;
    color: var(--muted); white-space: nowrap; }
  footer a { color: var(--blue); text-decoration: none; }
  footer .long + span { display: none; }
  @media (max-width: 640px) { footer .long + span { display: inline; } }
  #daynight { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 8px;
    padding: 11px 18px; border-radius: 999px; color: var(--text); font: 600 14px/1 inherit; font-family: inherit; cursor: pointer; z-index: 3; }
  #daynight:hover { background: rgba(60, 60, 64, 0.8); }
  #dnIcon { font-size: 17px; }
  @media (max-width: 900px) { #daynight { top: auto; bottom: 64px; } }
  #tip { position: fixed; pointer-events: none; padding: 10px 14px; font-size: 13px; opacity: 0; transition: opacity .12s;
    transform: translate(-50%, calc(-100% - 14px)); white-space: nowrap; }
  #tip b { font-size: 15px; }
  #tower { position: fixed; left: 16px; top: 230px; width: 212px; padding: 10px 8px 8px; font-size: 13px; }
  #tower .thead { display: flex; justify-content: space-between; padding: 0 8px 6px; color: var(--muted); font-size: 11px; letter-spacing: .4px; text-transform: uppercase; }
  #tower .thead b { color: var(--text); }
  #order { list-style: none; margin: 0; padding: 0; overflow: hidden; }
  #order li { display: flex; align-items: center; gap: 8px; height: 22px; padding: 0 8px; border-radius: 7px; font-variant-numeric: tabular-nums; }
  #order li:nth-child(odd) { background: rgba(255, 255, 255, 0.05); }
  #order .pos { width: 18px; text-align: right; color: var(--muted); font-weight: 600; }
  #order i { width: 4px; height: 14px; border-radius: 2px; }
  #order .name { flex: 1; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #order .gap { color: var(--muted); }
  #order .pit { color: #000; background: #ffd60a; font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 5px; }
  #zoom { position: fixed; right: 16px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; align-items: center;
    gap: 6px; padding: 8px 6px; border-radius: 999px; }
  #zoom button { width: 32px; height: 32px; border: 0; border-radius: 50%; background: transparent; color: var(--text);
    font-size: 22px; font-weight: 500; line-height: 1; font-family: inherit; cursor: pointer; }
  #zoom button:hover { background: rgba(118, 118, 128, 0.3); }
  #zoom .rail { width: 32px; height: 200px; display: flex; align-items: center; justify-content: center; }
  #zbar { width: 200px; height: 20px; margin: 0; flex: none; transform: rotate(-90deg); cursor: pointer; -webkit-appearance: none; appearance: none; background: transparent; }
  #zbar::-webkit-slider-runnable-track { height: 4px; border-radius: 2px; background: rgba(255, 255, 255, 0.3); }
  #zbar::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; margin-top: -7px; border-radius: 50%; background: #f5f5f7; box-shadow: 0 1px 4px rgba(0, 0, 0, 0.4); }
  #zbar::-moz-range-track { height: 4px; border-radius: 2px; background: rgba(255, 255, 255, 0.3); }
  #zbar::-moz-range-thumb { width: 18px; height: 18px; border: 0; border-radius: 50%; background: #f5f5f7; }
  #msg { position: fixed; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: 15px; }
  @media (max-width: 640px) {
    header { top: 10px; left: 10px; right: 10px; }
    .title { padding: 12px 16px; width: 100%; }
    .total { font-size: 34px; }
    .controls { width: 100%; padding: 10px; gap: 8px; }
    .seg button { padding: 8px 6px; font-size: 12px; }
    .stats { gap: 12px; }
    footer { font-size: 12px; bottom: 10px; }
    footer .long { display: none; }
    .legend { display: none; }
    #tower { top: auto !important; bottom: 108px; left: 10px; width: 190px; }
    #order li:nth-child(n+4) { display: none; }
    #zoom { right: 10px; } #zoom .rail { height: 140px; } #zbar { width: 140px; }
  }
</style>
</head>
<body>
<div id="msg">Loading contributions…</div>
<header>
  <div class="glass title">
    <div class="eyebrow">Altay Abdurakhim · Contributions in 3D</div>
    <div class="total"><span id="total">0</span><small id="range"></small></div>
    <div class="stats">
      <div><b id="active">0</b>active days</div>
      <div><b id="best">0</b>best day</div>
      <div><b id="streak">0</b>longest streak</div>
    </div>
  </div>
  <div class="glass controls">
    <div class="seg" id="presets"></div>
    <div class="seg" id="years"></div>
    <div class="dates">From <input type="date" id="from"> to <input type="date" id="to"></div>
    <div class="row">
      <div class="toggle on" id="spin"><span class="switch"></span>Auto-rotate</div>
      <div class="legend">Less <i></i> More</div>
    </div>
  </div>
</header>
<button class="glass" id="daynight" type="button" aria-label="Day or night"><span id="dnIcon">🌙</span><span id="dnText">Night</span></button>
<div class="glass" id="tip"></div>
<div class="glass" id="zoom"><button id="zin" type="button" aria-label="Zoom in">+</button><div class="rail"><input type="range" id="zbar" min="0" max="1000" value="500" aria-label="Zoom"></div><button id="zout" type="button" aria-label="Zoom out">−</button></div>
<div class="glass" id="tower"><div class="thead"><b>Lap <span id="lap">1</span></b><span>Interval</span></div><ol id="order"></ol></div>
<footer class="glass"><span class="long">Drag to rotate · Scroll or pinch to zoom · Right-drag to move · </span><span>Drag · pinch · two fingers to move · </span><a href="https://github.com/Doosi41">@Doosi41</a></footer>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

/* Один день — одно здание. Чем больше коммитов, тем больше этажей. Крыша красится по «составу шин» (wet → hard).
   Дни без коммитов — лужайка или тротуар, а по части из них петляет трасса. Её главная прямая с питлейном — на юге. */
const CELL = 2.0, DAY = 86400000, FLOOR_H = 0.34, MAX_FLOORS = 14, MERGE_MIN = 6;   // клетка крупная: трасса по городу широкая, можно обгонять
const STREET_Z = 1.5, STREET_X = 1.3, BLOCK_W = 4;      // ширина главной улицы и поперечных
const COMPOUNDS = ['#1a8fff', '#25e060', '#ff2d2d', '#ffe01a', '#ffffff'].map(c => new THREE.Color(c));   // wet, inter, soft, medium, hard
const $ = id => document.getElementById(id);
const iso = t => new Date(t).toISOString().slice(0, 10);
const parse = s => Date.parse(s + 'T00:00:00Z');
const fmt = (t, opts) => new Date(t).toLocaleDateString('en-US', { timeZone: 'UTC', ...opts });
const hash = (a, b = 0) => { let h = Math.imul(a ^ 0x9e3779b9, 0x85ebca6b) ^ Math.imul(b + 0x7f4a7c15, 0xc2b2ae35); h ^= h >>> 15; h = Math.imul(h, 0x2c1b3c6d); h ^= h >>> 12; return (h >>> 0) / 4294967296; };
const mix = (a, b, t) => a + (b - a) * t;

// ── сцена ──
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog('#070a16', 120, 520);
const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 2000);
const controls = new OrbitControls(camera, renderer.domElement);
Object.assign(controls, { enableDamping: true, dampingFactor: 0.08, autoRotate: true, autoRotateSpeed: 0.5,
  maxPolarAngle: Math.PI / 2.08, minDistance: 5, maxDistance: 480 });

const sky = new THREE.Mesh(new THREE.SphereGeometry(900, 48, 24), new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false,
  uniforms: { uNight: { value: 1 }, uFog: { value: new THREE.Vector3(0.03, 0.04, 0.09) }, uSun: { value: new THREE.Vector3(0.5, 0.6, 0.4).normalize() } },
  vertexShader: 'varying vec3 vDir; void main(){ vDir = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
  fragmentShader: `
    varying vec3 vDir; uniform float uNight; uniform vec3 uSun; uniform vec3 uFog;
    float h31(vec3 p){ p = fract(p * vec3(.1031, .1030, .0973)); p += dot(p, p.yxz + 33.33); return fract((p.x + p.y) * p.z); }
    void main(){
      vec3 d = normalize(vDir);
      float up = clamp(d.y, 0.0, 1.0);
      vec3 dayTop = vec3(0.16, 0.42, 0.86), dayHor = vec3(0.74, 0.86, 0.97);
      vec3 nightTop = vec3(0.004, 0.012, 0.045), nightHor = vec3(0.09, 0.11, 0.24);
      vec3 col = mix(mix(dayHor, dayTop, pow(up, 0.55)), mix(nightHor, nightTop, pow(up, 0.5)), uNight);
      float sd = max(dot(d, normalize(uSun)), 0.0);
      col += mix(vec3(1.0, 0.92, 0.7) * (pow(sd, 900.0) * 6.0 + pow(sd, 18.0) * 0.28), vec3(0.8, 0.88, 1.0) * (pow(sd, 1800.0) * 2.4 + pow(sd, 22.0) * 0.1), uNight);
      vec3 sp = floor(d * 380.0);
      float star = step(0.9965, h31(sp)) * smoothstep(0.08, 0.5, d.y);
      col += vec3(star) * uNight * (0.5 + 0.5 * h31(sp + 7.0));
      col = mix(uFog, col, smoothstep(0.0, 0.16, d.y));   // у горизонта небо сливается с туманом и дальним океаном
      gl_FragColor = vec4(col, 1.0);
    }`,
}));
scene.add(sky);

const hemi = new THREE.HemisphereLight('#bfd8ff', '#44503e', 1);
const sun = new THREE.DirectionalLight('#fff1d6', 3);
sun.castShadow = true;
sun.shadow.mapSize.set(4096, 4096);
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.04;
scene.add(hemi, sun, sun.target);
const NIGHT = { exposure: 1.3, hemi: 0.95, sun: 1.2, fog: new THREE.Color('#070a16'), sunColor: new THREE.Color('#a8bfff'), hemiSky: new THREE.Color('#3a5090'), hemiGround: new THREE.Color('#0c0e16') };
const DAYS = { exposure: 1.0, hemi: 1.15, sun: 3.2, fog: new THREE.Color('#b9d3ee'), sunColor: new THREE.Color('#fff1d6'), hemiSky: new THREE.Color('#bfd8ff'), hemiGround: new THREE.Color('#4a5a40') };
const uNight = { value: 1 };   // общий uniform: свет в окнах и фонарях

// ── трава, асфальт, общие материалы ──
// ── океан: бесконечная вода с волнами, пеной у берега и бликами; остров с городом посреди ──
const SEA_Y = -0.34;   // средний уровень воды, остров стоит над ним
const WAVES = [[1, 0.35, 40, 0.26], [-0.55, 1, 24, 0.18], [0.35, -1, 14, 0.12], [0.95, 0.75, 8.5, 0.065], [-1, -0.2, 5.5, 0.035]].map(([dx, dz, L, A], i) => {
  const l = Math.hypot(dx, dz), k = 2 * Math.PI / L;
  return { dx: dx / l, dz: dz / l, k, A, w: Math.sqrt(9.8 * k) * 0.85, ph: i * 1.7 };
});
const WAVE_SUM = WAVES.reduce((s, w) => s + w.A, 0);
const waveH = (x, z, t) => { let h = SEA_Y; for (const w of WAVES) h += w.A * Math.sin(w.k * (w.dx * x + w.dz * z) - w.w * t + w.ph); return h; };   // те же волны считает шейдер
const f5 = n => n.toFixed(5);
const WAVE_GLSL = WAVES.map(w => `{ float ph = ${f5(w.k)} * (${f5(w.dx)} * p.x + ${f5(w.dz)} * p.y) - ${f5(w.w)} * t + ${f5(w.ph)}; h += ${f5(w.A)} * sin(ph); grad += ${f5(w.A * w.k)} * cos(ph) * vec2(${f5(w.dx)}, ${f5(w.dz)}); }`).join('\n  ');
const SRGB = (r, g, b) => new THREE.Color().setRGB(r, g, b, THREE.SRGBColorSpace);
const OCEAN_DAY = { deep: new THREE.Color('#0a4f80'), shallow: new THREE.Color('#2fbfbd'), hor: SRGB(0.74, 0.86, 0.97), top: SRGB(0.16, 0.42, 0.86), sun: new THREE.Color('#fff2d0'), sunI: 1 };
const OCEAN_NIGHT = { deep: new THREE.Color('#0a2c4d'), shallow: new THREE.Color('#1b7088'), hor: SRGB(0.09, 0.11, 0.24), top: SRGB(0.004, 0.012, 0.045), sun: new THREE.Color('#9db4ff'), sunI: 0.5 };
const oceanMat = new THREE.ShaderMaterial({
  fog: false,
  uniforms: { uTime: { value: 0 }, uNight: uNight, uSunI: { value: 1 }, uFogNear: { value: 120 }, uFogFar: { value: 520 }, fogColor: { value: scene.fog.color },
    uDeep: { value: new THREE.Color() }, uShallow: { value: new THREE.Color() }, uSkyHor: { value: new THREE.Color() }, uSkyTop: { value: new THREE.Color() },
    uSunDir: { value: new THREE.Vector3(0, 1, 0) }, uSunCol: { value: new THREE.Color() }, uIsl: { value: new THREE.Vector4(0, 0, 60, 20) } },
  vertexShader: `
    uniform float uTime; varying vec3 vW; varying vec2 vGrad; varying float vH;
    void wave(vec2 p, float t, out float h, out vec2 grad) { h = 0.0; grad = vec2(0.0);
      ${WAVE_GLSL}
    }
    void main() { float h; vec2 g; wave(position.xz, uTime, h, g);
      vW = vec3(position.x, ${f5(SEA_Y)} + h, position.z); vGrad = g; vH = h;
      gl_Position = projectionMatrix * viewMatrix * vec4(vW, 1.0); }`,
  fragmentShader: `
    uniform float uTime, uNight, uSunI, uFogNear, uFogFar; uniform vec3 uDeep, uShallow, uSkyHor, uSkyTop, uSunDir, uSunCol, fogColor; uniform vec4 uIsl;
    varying vec3 vW; varying vec2 vGrad; varying float vH;
    float sdIsland(vec2 p) { vec2 q = abs(p - uIsl.xy) - (uIsl.zw - 10.0); return length(max(q, 0.0)) + min(max(q.x, q.y), 0.0) - 10.0; }
    void main() {
      vec3 V = cameraPosition - vW; float dist = length(V); V /= dist;
      vec2 p = vW.xz; float t = uTime, fade = 1.0 - smoothstep(40.0, 260.0, dist);
      vec2 g = vGrad;   // мелкая рябь поверх крупных волн
      g += fade * (0.012 * 1.7 * cos(dot(p, vec2(0.83, 0.55)) * 1.7 + t * 1.9) * vec2(0.83, 0.55)
                 + 0.009 * 2.6 * cos(dot(p, vec2(-0.5, 0.87)) * 2.6 - t * 2.3) * vec2(-0.5, 0.87)
                 + 0.006 * 3.9 * cos(dot(p, vec2(0.2, -0.98)) * 3.9 + t * 2.8) * vec2(0.2, -0.98));
      vec3 N = normalize(vec3(-g.x * 1.9, 1.0, -g.y * 1.9));   // волны выразительнее
      float F = (0.02 + 0.98 * pow(1.0 - max(dot(N, V), 0.0), 5.0)) * 0.78;
      vec3 R = reflect(-V, N); R.y = abs(R.y);
      vec3 sky = mix(uSkyHor, uSkyTop, pow(clamp(R.y, 0.0, 1.0), 0.45));
      float d = sdIsland(p);
      vec3 body = mix(uDeep, uShallow, (1.0 - smoothstep(0.0, 24.0, d)) * 0.85);
      float crest = clamp(vH / ${f5(WAVE_SUM)}, 0.0, 1.0);
      body = mix(body, body * 1.7 + uShallow * 0.12, crest * 0.4);
      vec3 col = mix(body, sky, F);
      float sd = max(dot(R, normalize(uSunDir)), 0.0);
      col += uSunCol * uSunI * (pow(sd, 320.0) * 9.0 + pow(sd, 40.0) * 0.35);   // солнечная (ночью лунная) дорожка
      float stripes = 0.5 + 0.5 * sin(d * 2.4 - t * 1.3 + 1.2 * sin(p.x * 0.3 + t * 0.2));   // пена накатывает на берег
      float foam = (1.0 - smoothstep(0.2, 3.6, d)) * (0.35 + 0.65 * stripes) + smoothstep(0.8, 1.0, crest) * 0.45 * fade;
      col = mix(col, vec3(mix(1.0, 0.5, uNight)), clamp(foam, 0.0, 1.0) * 0.85);
      col = mix(col, fogColor, smoothstep(uFogNear, uFogFar, dist));
      gl_FragColor = vec4(col, 1.0);
      #include <tonemapping_fragment>
      #include <colorspace_fragment>
    }`,
});
function oceanGeometry() {   // кольца: у острова густо, к горизонту редко
  const N = 300, SEG = 360, R = 1900, pos = new Float32Array((N + 1) * (SEG + 1) * 3), idx = [];
  for (let k = 0; k <= N; k++) {
    const r = k === 0 ? 0 : 3 + R * Math.pow(k / N, 2.2);
    for (let s = 0; s <= SEG; s++) { const a = s / SEG * Math.PI * 2, o = (k * (SEG + 1) + s) * 3; pos[o] = Math.cos(a) * r; pos[o + 1] = 0; pos[o + 2] = Math.sin(a) * r; }
  }
  for (let k = 0; k < N; k++) for (let s = 0; s < SEG; s++) { const a = k * (SEG + 1) + s, b = a + SEG + 1; idx.push(a, b, a + 1, a + 1, b, b + 1); }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3)); g.setIndex(idx);
  return g;
}
const ocean = new THREE.Mesh(oceanGeometry(), oceanMat);
ocean.frustumCulled = false;
scene.add(ocean);
const asphaltMat = new THREE.MeshStandardMaterial({ color: '#2b2d33', roughness: 0.9 });
const trackMat = new THREE.MeshStandardMaterial({ color: '#2b2d33', roughness: 0.9, emissive: '#2a2f3a', emissiveIntensity: 0 });   // трасса ночью освещена
const kerbMat = new THREE.MeshStandardMaterial({ roughness: 0.6 });
kerbMat.onBeforeCompile = shader => {   // поребрики ночью светятся своим цветом

    const sg = Math.sign(ix * nz - iz * nx);   // +1 - угол направления растёт, -1 - убывает
    segs.push({ arc: true, cx: ax - Math.sin(th) * r * sg, cz: az + Math.cos(th) * r * sg, th, sg, r, w: p[3], len: Math.PI * r / 2 });
    cx = p[0] + nx * r; cz = p[1] + nz * r;
  }
  track = { segs, len: segs.reduce((a, g) => a + g.len, 0), closed: true, flag: flagX - (pts[0][0] + rad[0]) };
  // новая трасса - новая гонка: стартовая решётка за клетчатой линией, по две машины в ряд
  raceT = 0; pit = null;
  cars.forEach((c, i) => Object.assign(c, { s: (track.flag - 1.2 - i + track.len) % track.len, dist: -1.2 - i, off: (i % 2 ? -1 : 1) * 0.5,
    v: 0, cool: 0, form: 1, goal: 1, formT: 0, mist: 1, seg: -1, attack: null, pit: null, stuck: false, pitAt: 30 + Math.random() * 120 }));   // когда пора в боксы (секунды гонки)
}

function sOnTrack(x, z) {   // где на оси трассы точка (x, z), если она лежит на одной из прямых
  let s = 0;
  for (const g of track.segs) {
    if (!g.arc) {
      const t = (x - g.x) * Math.cos(g.th) + (z - g.z) * Math.sin(g.th), side = (z - g.z) * Math.cos(g.th) - (x - g.x) * Math.sin(g.th);
      if (Math.abs(side) < 1e-6 && t >= 0 && t <= g.len) return s + t;
    }
    s += g.len;
  }
  return -1;
}

const PIT_SIDE = -1.2;   // пит-лейн отходит от широкой связки и возвращается на неё с этой стороны
const pitGhostS = p => (pit.sOut - (pit.path.len - p) + track.len) % track.len;   // где на трассе окажется болид с выезда

function setPit(xWest, xEast, laneZ, boxX) {   // пит-лейн: с западной связки налево вдоль боксов и на восточную связку
  const r = 1, x0 = xWest - PIT_SIDE, x1 = xEast + PIT_SIDE, straight = x1 - x0 - 2 * r, arc = Math.PI * r / 2;
  const segs = [
    { arc: true, cx: x0 + r, cz: laneZ - r, th: Math.PI / 2, sg: -1, r, len: arc },
    { x: x0 + r, z: laneZ, th: 0, len: straight },
    { arc: true, cx: x1 - r, cz: laneZ - r, th: 0, sg: -1, r, len: arc },
  ];
  const sIn = sOnTrack(xWest, laneZ - r), sOut = sOnTrack(xEast, laneZ - r);
  if (sIn < 0 || sOut < 0) return;
  pit = { path: { segs, len: 2 * arc + straight, closed: false }, sIn, sOut, hold: arc + straight,
    skip: ((sOut - sIn) % track.len + track.len) % track.len,   // сколько трассы объезжает пит-лейн: для таблицы
    box: boxX.map(x => arc + x - (x0 + r)) };
}

function pathAt(path, s) {   // точка на оси пути: координаты, направление, номер участка и сколько от его начала
  s = path.closed ? ((s % path.len) + path.len) % path.len : Math.min(Math.max(s, 0), path.len - 1e-6);
  for (let i = 0; i < path.segs.length; i++) {
    const g = path.segs[i];
    if (s < g.len) {
      if (!g.arc) return { x: g.x + Math.cos(g.th) * s, z: g.z + Math.sin(g.th) * s, th: g.th, i, local: s };
      const th = g.th + g.sg * s / g.r;
      return { x: g.cx + g.r * g.sg * Math.sin(th), z: g.cz - g.r * g.sg * Math.cos(th), th, i, local: s };
    }
    s -= g.len;
  }
  return pathAt(path, 0);
}

// машина занимает полосу, если едет в ней или как раз перестраивается
const wrap = d => { const L = track.len; return ((d % L) + L * 1.5) % L - L / 2; };   // знаковое расстояние по кругу
const crossed = (a, b, x) => b >= a ? a < x && x <= b : x > a || x <= b;          // проехали точку x за этот шаг

const cornerV = (c, r) => c.vmax * c.form * Math.min(0.65, Math.max(0.42, 0.3 + 0.2 * r));   // в повороте пошире можно быстрее
function limAt(s) {   // докуда центр болида может отойти от оси, не заезжая на поребрик
  const q = pathAt(track, s), g = track.segs[q.i];
  return (g.arc ? g.w : edgeWidth(g.edge, q.local + g.e0)) / 2 - (CAR_W / 2 + 0.02);
}

function lineOffset(c, q, g, lim) {   // траектория: перед поворотом снаружи, у апекса внутри, на выходе снова снаружи
  const segs = track.segs, n = segs.length, A = lim * 0.75 * c.style;
  if (g.arc) return -g.sg * A * Math.cos(2 * Math.PI * q.local / g.len);
  const entry = -segs[(q.i + 1) % n].sg * Math.max(0, 1 - (g.len - q.local) / 3);
  const exit = -segs[(q.i + n - 1) % n].sg * Math.max(0, 1 - q.local / 2);
  return (entry + exit) * A + c.bias * lim * 3;
}

function place(c, lat) {   // болид на трассе или на пит-лейне; lat - скорость вбок, от неё нос чуть поворачивает
  const q = c.pit ? pathAt(pit.path, c.pit.p) : pathAt(track, c.s);
  c.mesh.position.set(q.x - Math.sin(q.th) * c.off, 0.04, q.z + Math.cos(q.th) * c.off);
  c.mesh.rotation.y = -(q.th + Math.atan2(lat, Math.max(c.v, 1)));
}

function pitStep(c, dt) {
  /* Пит-лейн: быстрая полоса посередине и полоса боксов у гаражей. У каждого бокса два места - сам бокс и сразу за ним,
     как при двойном пит-стопе. Место выбираем при въезде; если оба заняты - проезжаем насквозь.
     По быстрой полосе едут друг за другом, из бокса выезжают, только когда в быстрой полосе свободно. */
  const P = c.pit, len = pit.path.len, inLane = o => o !== c && o.pit && o.off > -0.5;
  if (P.slot === undefined) {
    const taken = x => cars.some(o => o !== c && o.pit && o.pit.slot != null && !o.pit.done && Math.abs(o.pit.slot - x) < CAR_L + 0.2);
    const b = pit.box[c.team], back = b - CAR_L - 0.4;
    P.slot = !taken(b) ? b : !taken(back) ? back : null;
  }
  const stopping = P.slot != null && !P.done;
  let target = PIT_V;
  if (stopping) target = Math.min(target, Math.sqrt(10 * Math.max(0, P.slot - P.p)));   // тормозим к своему месту
  for (const o of cars) if (inLane(o)) { const d = o.pit.p - P.p; if (d > 0 && d < FOLLOW + 1.5) target = Math.min(target, o.v + (d - FOLLOW) * 2); }
  const leaving = P.done && c.off < -0.5;   // ещё в боксе: выезжаем, только если в быстрой полосе никого рядом
  const wait = leaving && cars.some(o => inLane(o) && o.pit.p - P.p > -2.5 && o.pit.p - P.p < CAR_L + 0.3);
  if (wait) target = 0;
  if (P.p >= pit.hold - 0.3 && !P.go) {   // выезд: вливаемся, если сзади по нашей стороне есть место затормозить
    const sv = pitGhostS(P.p);
    if (cars.some(o => !o.pit && Math.abs(o.off - PIT_SIDE) < CAR_W + 0.06 && (d => d > -(3.5 + o.v * 0.3) && d < 1.5)(wrap(o.s - sv)))) target = 0;
    else P.go = true;
  }
  if (stopping && P.slot - P.p < 0.05) {   // стоим: механики меняют шины
    c.v = 0;
    if (c.off < -0.55 && (P.stop += dt) >= PIT_STOP) P.done = true;
  } else c.v = Math.max(0, c.v + Math.max(-10 * dt, Math.min(4 * dt, target - c.v)));
  if (!P.go && P.p + c.v * dt > pit.hold) { P.p = pit.hold; c.v = 0; }   // ждём у линии выезда
  P.p += c.v * dt; c.dist += c.v * dt * pit.skip / len;
  if (P.p >= len) {   // на трассе, по своей стороне; дальше как все
    c.s = (pit.sOut + P.p - len) % track.len; c.off += PIT_SIDE; c.pit = null; c.seg = -1; c.cool = 1; c.pitAt = raceT + 70 + Math.random() * 80;
    place(c, 0); return;
  }
  const want = stopping && P.slot - P.p < 1.4 ? -0.58 : 0;   // к своему месту - в полосу боксов
  const side = wait ? 0 : Math.max(-1.2 * dt, Math.min(1.2 * dt, want - c.off));
  c.off += side;
  place(c, side / Math.max(dt, 1e-3));
}

function race(dt) {
  if (!track) return;
  raceT += dt;
  const L = track.len, segs = track.segs, n = segs.length, onTrack = cars.filter(c => !c.pit);
  // кто уже выезжает с пит-лейна, для остальных как будто стоит на трассе у выезда: его пропускают
  // и кто только что свернул на пит-лейн - для едущих следом он ещё впереди на въезде
  const others = onTrack.concat(cars.filter(c => c.pit && c.pit.go).map(c => ({ s: pitGhostS(c.pit.p), off: PIT_SIDE, v: c.v, vmax: c.vmax, form: c.form, no: c.no, ghost: true })),
    cars.filter(c => c.pit && c.pit.p < 5).map(c => ({ s: (pit.sIn + c.pit.p) % L, off: PIT_SIDE + c.off, v: c.v, vmax: c.vmax, form: c.form, no: c.no, ghost: true })));
  for (const c of cars) {
    if ((c.formT -= dt) <= 0) { c.formT = 4 + Math.random() * 8; c.goal = 0.95 + Math.random() * 0.07; }   // форма гонщика плавает
    c.form += (c.goal - c.form) * Math.min(1, dt * 0.3);
    if (c.pit) { pitStep(c, dt); continue; }
    const q = pathAt(track, c.s), g = segs[q.i], next = segs[(q.i + 1) % n];
    if (q.i !== c.seg) { c.seg = q.i; c.mist = g.arc && Math.random() < 0.05 ? 0.75 : 1; }   // иногда ошибается и тормозит в повороте сильнее
    const toCorner = g.arc ? 0 : g.len - q.local, vtop = c.vmax * c.form;
    // скорость: в повороте по радиусу, перед ним тормозим так, чтобы успеть к повороту
    let target = g.arc ? cornerV(c, g.r) * c.mist : Math.min(vtop, Math.sqrt(cornerV(c, next.r) ** 2 + 2 * BRAKE * Math.max(0, toCorner - 0.2)));
    // впереди трасса сужается: заранее держимся в её ширине и не атакуем
    const lim = limAt(c.s), limAhead = Math.min(lim, limAt(c.s + 3), limAt(c.s + 6)), merging = limAhead < lim - 0.05;
    let ahead = null, gap = Infinity;   // ближайший впереди из тех, кто мешает по ширине
    for (const o of others) if (o !== c && Math.abs(o.off - c.off) < CAR_W + 0.04) { const d = (o.s - c.s + L) % L; if (d > 0 && d < gap) { gap = d; ahead = o; } }
    if (ahead && !ahead.ghost && gap < 3.5 && !g.arc) target *= 1.06;   // слипстрим
    // кто рядом и не влезает при сужении: тот, кто чуть сзади, притормаживает и встаёт в хвост
    for (const o of onTrack) {
      if (o === c) continue;
      const d = wrap(o.s - c.s);
      if (Math.abs(d) < CAR_L + 0.5 && (d > 0 || (d === 0 && o.no < c.no)) && (c.stuck || o.stuck)) target = Math.min(target, o.v - 1);
    }
    // атака: быстрее того, кто впереди, и до поворота есть место - выходим из-за спины
    c.cool -= dt;
    // в городе атакуем и на короткой прямой, на позднем торможении; на главной прямой - если до поворота есть место
    if (!c.attack && !merging && !g.arc && ahead && !ahead.ghost && gap < FOLLOW + 1.6 && c.cool <= 0 && toCorner > (lim < 0.9 ? 1.5 : 3) && limAhead > 0.25 && vtop > ahead.vmax * ahead.form + 0.1) {
      const side = ahead.off > 0.05 ? -1 : ahead.off < -0.05 ? 1 : next.sg;
      const want = side * Math.min(LANE, limAhead - 0.02);
      if (!onTrack.some(o => o !== c && o !== ahead && Math.abs(wrap(o.s - c.s)) < 2.2 && Math.abs(o.off - want) < CAR_W + 0.04)) c.attack = { side, rival: ahead, t: 5 };
    }
    // атака идёт и через поворот колесо в колесо; кончается, когда обогнали, вышло время или трасса сужается
    if (c.attack && (merging || c.attack.rival.pit || (c.attack.t -= dt) <= 0 || wrap(c.s - c.attack.rival.s) > CAR_L + 0.3)) { c.attack = null; c.cool = 1.5; }
    if (c.attack) target *= 1.04;   // атакующий давит сильнее
    if (ahead && gap < FOLLOW + 1.5) target = Math.min(target, ahead.v + (gap - FOLLOW) * 2);   // держим дистанцию
    c.v = Math.max(0, c.v + Math.max(-18 * dt, Math.min(6.5 * dt, target - c.v)));
    if (ahead && gap < FOLLOW * 0.7) c.v = Math.min(c.v, ahead.v * 0.8);   // слишком близко: пропускаем вперёд
    const was = c.s;
    c.s = (c.s + c.v * dt) % L; c.dist += c.v * dt;
    const toPit = pit && raceT >= c.pitAt ? (pit.sIn - c.s + L) % L : Infinity;   // пора в боксы: сколько до въезда
    if (toPit < Infinity && crossed(was, c.s, pit.sIn)) {
      if (Math.abs(c.off - PIT_SIDE) < 0.35) {   // на въезде с нужной стороны - в боксы, иначе на следующем круге
        c.pit = { p: wrap(c.s - pit.sIn), stop: 0, done: false, go: false }; c.off -= PIT_SIDE; c.attack = null; c.stuck = false;
        place(c, 0); continue;
      }
    }
    // по ширине: к своей траектории или в сторону для обгона, не за кромку и не впритирку к соседу
    const want = Math.max(-limAhead, Math.min(limAhead, toPit < 14 ? PIT_SIDE : c.attack ? c.attack.side * Math.min(LANE, limAhead - 0.02) : lineOffset(c, q, g, lim)));
    const rate = (0.3 + 0.15 * c.v) * dt;   // вбок быстрее, когда едешь быстрее
    let side = Math.max(-rate, Math.min(rate, want - c.off));
    if (others.some(o => o !== c && Math.abs(wrap(o.s - c.s)) < CAR_L + 0.15 && Math.abs(o.off - c.off - side) < CAR_W && Math.abs(o.off - c.off - side) <= Math.abs(o.off - c.off))) side = 0;
    c.off += side;
    c.stuck = Math.abs(c.off) > limAhead + 0.01 && side === 0;   // не успевает в ширину трассы: кто-то рядом
    if (Math.abs(c.off) > lim) c.off = Math.sign(c.off) * lim;   // за поребрик не выезжаем
    place(c, side / Math.max(dt, 1e-3));
  }
}

// ── таблица лидеров: кто на каком месте, отставание от лидера, кто в боксах ──
const towerRows = cars.map(() => { const li = document.createElement('li'); li.innerHTML = '<span class="pos"></span><i></i><span class="name"></span><span></span>'; $('order').append(li); return li; });
const towerColor = TEAMS.map(([body, accent]) => { const h = {}; new THREE.Color(body).getHSL(h); return h.l < 0.15 ? accent : body; });
let towerT = 0;
function updateTower(dt) {
  if (!track || (towerT -= dt) > 0) return;
  towerT = 0.25;
  const order = cars.slice().sort((a, b) => b.dist - a.dist), lead = order[0], L = track.len, pace = Math.max(lead.dist / Math.max(raceT, 1), 1);
  $('lap').textContent = Math.max(1, Math.floor(lead.dist / L) + 1);
  order.forEach((c, j) => {
    const [pos, bar, no, gap] = towerRows[j].children, behind = lead.dist - c.dist, laps = Math.floor(behind / L);
    pos.textContent = j + 1; bar.style.background = towerColor[c.team]; no.textContent = c.name;
    gap.className = c.pit ? 'pit' : 'gap';
    gap.textContent = c.pit ? 'PIT' : j === 0 ? 'Leader' : laps >= 1 ? `+${laps} lap${laps > 1 ? 's' : ''}` : `+${(behind / pace).toFixed(1)}`;

}
function placeTower() {   // под шапкой и не выше нижнего края окна
  const top = document.querySelector('header').getBoundingClientRect().bottom + 12;
  if (innerWidth > 640) { $('tower').style.top = top + 'px'; $('order').style.maxHeight = Math.max(66, innerHeight - top - 110) + 'px'; }
  else $('order').style.maxHeight = '';
}

// ── Монако: тоннель с отелем над ним, гавань Порт-Эркюль с яхтами, подписи поворотов ──
const barrierMat = new THREE.MeshStandardMaterial({ color: '#e3e6ea', roughness: 0.6 });
const tunnelMat = new THREE.MeshStandardMaterial({ color: '#8f96a1', roughness: 0.8 });
const tunnelLight = new THREE.MeshStandardMaterial({ color: '#332a18', emissive: '#ffd27a', emissiveIntensity: 1.6 });
const seaMat = new THREE.MeshStandardMaterial({ color: '#1f6aa0', roughness: 0.15, metalness: 0.35 });
const yachtWhite = new THREE.MeshStandardMaterial({ color: '#f4f6f9', roughness: 0.35 });
const yachtGlass = new THREE.MeshStandardMaterial({ color: '#2b3d55', roughness: 0.2, metalness: 0.4 });
const yachtLight = new THREE.MeshStandardMaterial({ color: '#331', emissive: '#ffd27a', emissiveIntensity: 2 });
const hullGeo = new THREE.CylinderGeometry(0.7071 * 0.35, 0.7071, 1, 4, 1).rotateY(Math.PI / 4).rotateZ(-Math.PI / 2).translate(0, 0.5, 0);   // нос уже кормы

function monaco(xWest, xEast, zSouth, zTop, hairpinAt, mainW) {
  // тоннель над спуском западной связки, от шпильки к главной прямой; сверху отель, как Fairmont в Монако
  const z1 = zTop + 1.6, z2 = zSouth - 7;
  if (z2 - z1 >= 3) {
    const h = limAt(sOnTrack(xWest, z2)) + CAR_W / 2 + 0.02 + 0.45, len = z2 - z1, zc = (z1 + z2) / 2;
    const g = new THREE.Group();
    const part = (mat, x, y, z, sx, sy, sz) => { const m = new THREE.Mesh(box, mat); m.position.set(x, y, z); m.scale.set(sx, sy, sz); m.castShadow = m.receiveShadow = true; g.add(m); return m; };
    for (const sx of [-1, 1]) part(tunnelMat, xWest + sx * (h + 0.15), 0, zc, 0.3, 1.35, len);   // стены
    part(tunnelMat, xWest, 1.35, zc, 2 * h + 0.6, 0.25, len);                                       // крыша
    for (let z = z1 + 0.8; z < z2 - 0.4; z += 1.6) part(tunnelLight, xWest, 1.28, z, 0.5, 0.05, 0.6).castShadow = false;   // светильники
    const hotel = instanced(box, wallMat, 1, { windows: true });
    dummy.rotation.set(0, 0, 0); dummy.position.set(xWest, 1.6, zc); dummy.scale.set(2 * h + 0.4, 3.4, len - 0.6); dummy.updateMatrix(); hotel.setMatrixAt(0, dummy.matrix);
    hotel.setColorAt(0, new THREE.Color('#e9dccb'));
    const a = hotel.geometry.attributes; a.aFloors.setX(0, 10); a.aCols.setXY(0, Math.round((2 * h + 0.4) / 0.35), Math.round(len / 0.35)); a.aSeed.setX(0, 0.37);
    g.add(hotel);
    world.add(g);
    const tl = label('TUNNEL', 0.6); tl.position.set(xWest, 5.8, zc); world.add(tl);
  }
  if (hairpinAt) { const hl = label('FAIRMONT', 0.6); hl.position.set(hairpinAt[0] - 1, 2.2, hairpinAt[1] + 1.6); world.add(hl); }
  const sd = label('STE DÉVOTE', 0.6); sd.position.set(xEast + 2.5, 2.2, zSouth + 2); world.add(sd);

  // гавань: набережная, вода и яхты вдоль главной прямой
  const z0 = zSouth + mainW / 2 + 0.9, x0 = xWest - 10, x1 = xEast + 10;
  const quay = new THREE.Mesh(box, new THREE.MeshStandardMaterial({ color: '#c9ccd1', roughness: 0.9 }));
  quay.position.set(0, -0.5, z0 - 0.45); quay.scale.set(x1 - x0, 0.48, 0.9); quay.receiveShadow = true; world.add(quay);   // стенка набережной до самой воды
  const n = Math.max(6, Math.round((x1 - x0) / 5)), yachts = [];
  for (let i = 0; i < n; i++) yachts.push({ x: x0 + 4 + (i + hash(i, 21) * 0.6) * (x1 - x0 - 8) / n, z: z0 + 2.2 + (i % 3) * 2.4 + hash(i, 22),
    s: 0.9 + hash(i, 23) * 0.9, ph: hash(i, 24) * 6.28 });
  const parts = [instanced(hullGeo, yachtWhite, n), instanced(box, yachtWhite, n), instanced(box, yachtGlass, n), instanced(cyl, barrierMat, n), instanced(sphere, yachtLight, n)];
  parts[4].castShadow = false;
  world.add(...parts);
  world.userData.yachts = { list: yachts, parts };
  const ph = label('PORT HERCULE', 0.8); ph.position.set(0, 3, z0 + 9); world.add(ph);
}

function bobYachts(t) {   // яхты покачиваются на волнах
  const Y = world.userData.yachts;
  if (!Y) return;
  const [hull, deck, glass, mast, lamp] = Y.parts;
  Y.list.forEach((y, i) => {

function buildIsland(xWest, xEast, zSouth, D, mainW, hairpinX) {
  const z0 = zSouth + mainW / 2 + 0.9;   // линия набережной
  const minX = xWest - hairpinX - 12, maxX = xEast + 12, minZ = -D / 2 - 8;
  const cx = (minX + maxX) / 2, hx = (maxX - minX) / 2, hz = (z0 - minZ) * 0.58, cz = minZ + hz;
  const pts = [], N = 220;
  for (let i = 0; i < N; i++) {
    const a = i / N * Math.PI * 2, c = Math.cos(a), s = Math.sin(a), e = 0.25;
    const w = 1 + 0.018 * (0.5 * Math.sin(3 * a + 1.3) + 0.35 * Math.sin(5 * a + 0.4) + 0.25 * Math.sin(9 * a + 2.1));
    pts.push(new THREE.Vector2(cx + hx * Math.sign(c) * Math.pow(Math.abs(c), e) * w, Math.min(z0, cz + hz * Math.sign(s) * Math.pow(Math.abs(s), e) * w)));

}

function build(from, to) {
  world.clear();
  const start = from - new Date(from).getUTCDay() * DAY;   // неделя с воскресенья, как на GitHub
  cells = [];
  let max = 1, total = 0, active = 0, best = [0, from], streak = 0, run = 0;
  for (let t = from; t <= to; t += DAY) {
    const c = counts.get(iso(t)) || 0;
    cells.push({ t, c, week: Math.floor((t - start) / DAY / 7), dow: new Date(t).getUTCDay() });
    max = Math.max(max, c); total += c;
    if (c) { active++; run++; streak = Math.max(streak, run); } else run = 0;
    if (c > best[0]) best = [c, t];
  }
  const weeks = cells[cells.length - 1].week + 1;

  // раскладка квартала с улицами: главная улица между вт и ср, поперечные каждые 4 недели
  const xs = [], zs = [];
  for (let w = 0; w < weeks; w++) xs.push(w * CELL + Math.floor(w / BLOCK_W) * STREET_X);
  for (let d = 0; d < 7; d++) zs.push(d * CELL + (d >= 3 ? STREET_Z : 0));
  const W = xs[weeks - 1] + CELL, D = zs[6] + CELL;
  const X = w => xs[w] - W / 2 + CELL / 2, Z = d => zs[d] - D / 2 + CELL / 2;
  for (const c of cells) { c.x = X(c.week); c.z = Z(c.dow); }
  // трасса через город по дням без коммитов
  const route = cityRoute(weeks, new Set(cells.filter(c => c.c).map(c => c.week * 7 + c.dow)));
  const onTrack = new Set(route.filter(([, r]) => r >= 0).map(([w, r]) => w * 7 + r));

  roadFloor.position.set(0, 0, 0); roadFloor.scale.set(W + 0.1, 1, D + 0.1);   // асфальт под плитками: из него получаются улицы

  // здания: соседние сильные дни (по 6+ коммитов) объединяются в один большой комплекс
  buildings = [];
  const byKey = new Map(cells.map((c, i) => [c.week * 7 + c.dow, i]));
  const used = new Set();
  cells.forEach((cell, i) => {
    if (!cell.c || used.has(i)) return;
    const nextI = byKey.get(cell.week * 7 + cell.dow + 1), next = nextI !== undefined ? cells[nextI] : null;
    const merge = cell.c >= MERGE_MIN && next && next.c >= MERGE_MIN && cell.dow + 1 !== 3 && cell.dow < 6 && !used.has(nextI);
    const ids = merge ? [i, nextI] : [i];
    ids.forEach(k => used.add(k));
    const c = ids.reduce((a, k) => a + cells[k].c, 0), k = Math.sqrt(Math.min(c / max, 1.7));
    const floors = Math.max(1, Math.min(MAX_FLOORS + 3, 1 + Math.round(k * (MAX_FLOORS - 1))));
    const type = floors <= 1 ? 'hut' : floors <= 3 ? 'house' : floors <= 8 ? 'mid' : 'tower';
    const seed = hash(cell.week, cell.dow);
    const pal = WALL_PALETTES[type];
    const w = merge ? 1.12 : { hut: 0.75, house: 0.95, mid: 1.07, tower: 1.12 }[type];
    const d = merge ? CELL * 2 - 0.3 : w;
    buildings.push({
      ids, c, floors, type, seed, merged: merge, w, d, H: floors * FLOOR_H + 0.08,
      x: ids.reduce((a, q) => a + cells[q].x, 0) / ids.length, z: ids.reduce((a, q) => a + cells[q].z, 0) / ids.length,
      wall: new THREE.Color(pal[Math.floor(seed * pal.length) % pal.length]), roof: compound(Math.min(Math.sqrt(c / max), 1)),
      cols: [Math.max(2, Math.round(w / 0.26)), Math.max(2, Math.round(d / 0.26))],
    });
  });
  const tallest = buildings.reduce((a, b) => (!a || b.H > a.H ? b : a), null);
  if (tallest) {   // на самой высокой крыше площадка с вертолётом: нужна плоская крыша
    tallest.tallest = true;
    if (tallest.type === 'hut' || tallest.type === 'house') { tallest.type = 'mid'; tallest.wall = new THREE.Color(WALL_PALETTES.mid[0]); }
  }

  // ── улицы: главная между вт и ср, поперечные, разметка ──

  mark.forEach(([x, z, sx, sz], i) => { dummy.rotation.set(0, 0, 0); dummy.position.set(x, 0.045, z); dummy.scale.set(sx, 0.005, sz); dummy.updateMatrix(); marks.setMatrixAt(i, dummy.matrix); });
  world.add(marks);

  // ── трасса: главная прямая с питлейном на юге (+z), связки по краям, дальше через город с востока на запад ──
  const TRACK_W = 3.2, M = 2.4;
  const pitDepth = 1.7, laneW = 1.5;
  const zSouthEdge = D / 2 + M;                         // начало пит-комплекса
  const pitZ = zSouthEdge + pitDepth / 2;               // центр боксов
  const laneZ = zSouthEdge + pitDepth + laneW / 2;      // пит-лейн
  const zSouth = zSouthEdge + pitDepth + laneW + 0.5 + TRACK_W / 2;   // главная прямая
  const xWest = -W / 2 - M - TRACK_W / 2, xEast = W / 2 + M + TRACK_W / 2;
  const rowZ = r => r < 0 ? Z(0) - CELL : Z(r);   // ряд -1 - улица за северным краем квартала
  const rw = route[route.length - 1][1], zw = rowZ(rw), hairpin = rw <= HAIRPIN_ROW;
  const tail = hairpin ? [[xWest - HAIRPIN_X, zw], [xWest - HAIRPIN_X, zw + HAIRPIN_Z], [xWest, zw + HAIRPIN_Z]] : [[xWest, zw]];   // шпилька - разворот на 180°
  const pts = [[xWest, zSouth], [xEast, zSouth], [xEast, rowZ(route[0][1])], ...route.map(([w, r]) => [X(w), rowZ(r)]), ...tail];
  const corners = pts.filter((p, i) => {   // оставляем только углы
    const a = pts[(i + pts.length - 1) % pts.length], b = pts[(i + 1) % pts.length];
    return !(a[0] === p[0] && p[0] === b[0]) && !(a[1] === p[1] && p[1] === b[1]);
  }).map((p, i) => [p[0], p[1], i < 2 ? 2.5 : CELL / 2, i < 2 ? TRACK_W : CITY_W]);   // [x, z, радиус, ширина]
  setTrack(corners, -W / 4);
  // асфальт - лента вдоль оси трассы с плавными поворотами, как на картинке в README; поребрики по обеим кромкам
  const verts = [], idx = [], kerbs = [], barriers = [], prev = [null, null], prevB = [null, null], walked = [0, 0];
  const sIn = sOnTrack(xWest, laneZ - 1), sOut = sOnTrack(xEast, laneZ - 1);   // въезд и выезд пит-лейна: там в отбойнике проём
  const steps = Math.ceil(track.len / 0.15);
  for (let k = 0; k <= steps; k++) {
    const sk = (k / steps) * track.len, q = pathAt(track, sk % track.len), h = limAt(sk % track.len) + CAR_W / 2 + 0.02;
    const nx = -Math.sin(q.th), nz = Math.cos(q.th);
    [[q.x + nx * h, q.z + nz * h], [q.x - nx * h, q.z - nz * h]].forEach(([x, z], side) => {
      verts.push(x, 0.04, z);
      if (prev[side]) {   // кирпичик поребрика от прошлой точки кромки до этой, цвет меняется каждые 0,45 клетки
        const [px, pz] = prev[side], len = Math.hypot(x - px, z - pz);
        kerbs.push([(x + px) / 2, (z + pz) / 2, len, Math.atan2(z - pz, x - px), Math.floor((walked[side] + len / 2) / 0.45) % 2]);
        walked[side] += len;
      }
      prev[side] = [x, z];
      // отбойник чуть дальше поребрика; нет его вдоль стены пит-лейна и в проёмах въезда и выезда
      const bx = x + (side ? -nx : nx) * 0.32, bz = z + (side ? -nz : nz) * 0.32, s0 = sk % track.len;
      const gap = side === 1 && (q.i === 0 || Math.abs(wrap(s0 - sIn)) < 3 || Math.abs(wrap(s0 - sOut)) < 3);
      if (prevB[side] && !gap && k % 2 === 0) {
        const [px, pz] = prevB[side];
        barriers.push([(bx + px) / 2, (bz + pz) / 2, Math.hypot(bx - px, bz - pz), Math.atan2(bz - pz, bx - px)]);
      }
      if (k % 2 === 0 || gap) prevB[side] = gap ? null : [bx, bz];
    });
    if (k) idx.push(2 * k - 2, 2 * k, 2 * k - 1, 2 * k - 1, 2 * k, 2 * k + 1);   // лицом вверх
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
  geo.setAttribute('normal', new THREE.Float32BufferAttribute(verts.map((_, j) => j % 3 === 1 ? 1 : 0), 3));
  geo.setIndex(idx);
  const ribbon = new THREE.Mesh(geo, trackMat); ribbon.receiveShadow = true; world.add(ribbon);
  const pitLane = new THREE.Mesh(box, trackMat); pitLane.position.set(0, 0, laneZ); pitLane.scale.set(xEast - xWest, 0.045, laneW);   // с въездом и выездом на связки
  pitLane.receiveShadow = true; world.add(pitLane);
  const kerbMesh = instanced(box, kerbMat, kerbs.length);
  kerbMesh.castShadow = false;
  kerbs.forEach(([x, z, len, ang, red], i) => {
    dummy.rotation.set(0, -ang, 0); dummy.position.set(x, 0.03, z); dummy.scale.set(len + 0.02, 0.03, 0.16); dummy.updateMatrix(); kerbMesh.setMatrixAt(i, dummy.matrix);
    kerbMesh.setColorAt(i, new THREE.Color(red ? '#d3141f' : '#f1f1ee'));
  });
  world.add(kerbMesh);
  const barrierMesh = instanced(box, barrierMat, barriers.length);
  barriers.forEach(([x, z, len, ang], i) => {
    dummy.rotation.set(0, -ang, 0); dummy.position.set(x, 0.02, z); dummy.scale.set(len + 0.02, 0.24, 0.07); dummy.updateMatrix(); barrierMesh.setMatrixAt(i, dummy.matrix);
  });
  world.add(barrierMesh);
  monaco(xWest, xEast, zSouth, hairpin ? zw + HAIRPIN_Z : zw, hairpin ? [xWest - HAIRPIN_X, zw] : null, TRACK_W);
  // осевая пунктирная линия главной прямой и финишная
  const tl = [];
  for (let x = xWest + 3; x < xEast - 3; x += 1.3) tl.push([x, zSouth, 0.7, 0.06]);   // только на прямой, не в поворотах
  const tlm = instanced(box, lineMat, tl.length); tlm.castShadow = false;
  tl.forEach(([x, z, sx, sz], i) => { dummy.rotation.set(0, 0, 0); dummy.position.set(x, 0.045, z); dummy.scale.set(sx, 0.004, sz); dummy.updateMatrix(); tlm.setMatrixAt(i, dummy.matrix); });
  world.add(tlm);
  const flag = (() => {   // клетчатая финишная линия
    const c = document.createElement('canvas'); c.width = 64; c.height = 256;
    const g = c.getContext('2d');
    for (let y = 0; y < 16; y++) for (let x = 0; x < 4; x++) { g.fillStyle = (x + y) % 2 ? '#f5f5f7' : '#111'; g.fillRect(x * 16, y * 16, 16, 16); }
    const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
    return new THREE.Mesh(new THREE.PlaneGeometry(0.7, TRACK_W), new THREE.MeshStandardMaterial({ map: t, roughness: 0.8 }));
  })();
  flag.rotation.x = -Math.PI / 2; flag.position.set(-W / 4, 0.047, zSouth); world.add(flag);

  // пит-комплекс: ряд боксов с открытыми воротами, шины, светофорная рамка, стена
  const bays = Math.max(4, Math.min(12, Math.round(W / 6)));
  const bayW = (xEast - xWest - 8) / bays;
  const pitBuild = new THREE.Group();
  const garageMat = new THREE.MeshStandardMaterial({ color: '#d9dbe0', roughness: 0.7 });
  const doorMat = new THREE.MeshStandardMaterial({ color: '#0e0f12', emissive: '#ffd89a', emissiveIntensity: 0.0, roughness: 0.4 });
  const teams = TEAMS.map(t => t[0]);
  for (let i = 0; i < bays; i++) {
    const x = -(bays * bayW) / 2 + bayW * (i + 0.5);
    const body = new THREE.Mesh(box, garageMat); body.scale.set(bayW - 0.12, 1.3, pitDepth); body.position.set(x, 0, pitZ); body.castShadow = body.receiveShadow = true; pitBuild.add(body);
    const stripe = new THREE.Mesh(box, new THREE.MeshStandardMaterial({ color: teams[i % teams.length], roughness: 0.4, emissive: teams[i % teams.length], emissiveIntensity: 0.25 })); stripe.scale.set(bayW - 0.12, 0.2, 0.04); stripe.position.set(x, 1.34, pitZ + pitDepth / 2 + 0.01); pitBuild.add(stripe);
    const door = new THREE.Mesh(box, doorMat); door.scale.set(bayW * 0.7, 0.85, 0.04); door.position.set(x, 0.12, pitZ + pitDepth / 2 + 0.01); pitBuild.add(door);
    const tireStack = instanced(new THREE.CylinderGeometry(0.17, 0.17, 0.12, 14).translate(0, 0.06, 0), new THREE.MeshStandardMaterial({ color: '#17171a', roughness: 0.9 }), 3);
    for (let j = 0; j < 3; j++) { dummy.rotation.set(0, 0, 0); dummy.position.set(x + bayW * 0.3, 0.05 + j * 0.13, pitZ + pitDepth / 2 + 0.22); dummy.scale.set(1, 1, 1); dummy.updateMatrix(); tireStack.setMatrixAt(j, dummy.matrix); }
    pitBuild.add(tireStack);
  }
  const wall = new THREE.Mesh(box, new THREE.MeshStandardMaterial({ color: '#c9cbd1', roughness: 0.8 })); wall.scale.set(xEast - xWest - 4, 0.28, 0.08); wall.position.set(0, 0, laneZ + laneW / 2 + 0.2); pitBuild.add(wall);
  const gantry = new THREE.Group();   // светофор на старте пит-лейна
  const beamG = new THREE.Mesh(box, new THREE.MeshStandardMaterial({ color: '#2a2c31', metalness: 0.5, roughness: 0.5 })); beamG.scale.set(1.8, 0.14, 0.14); beamG.position.set(0, 1.9, 0); gantry.add(beamG);
  for (const s of [-1, 1]) { const p = new THREE.Mesh(box, beamG.material); p.scale.set(0.12, 1.9, 0.12); p.position.set(s * 0.9, 0, 0); gantry.add(p); }
  for (let i = 0; i < 5; i++) { const l = new THREE.Mesh(sphere, new THREE.MeshStandardMaterial({ color: '#300', emissive: '#ff1a1a', emissiveIntensity: 1.8 })); l.scale.setScalar(0.15); l.position.set(-0.6 + i * 0.3, 1.78, 0.1); gantry.add(l); }
  gantry.position.set(-(bays * bayW) / 2 + 0.6, 0, laneZ - laneW / 2); pitBuild.add(gantry);
  pitBuild.userData.doorMat = doorMat;
  world.add(pitBuild);
  world.userData.doorMat = doorMat;
  setPit(xWest, xEast, laneZ, TEAMS.map((_, t) => -(bays * bayW) / 2 + bayW * (t % bays + 0.5)));   // болид встаёт у бокса своей команды
  const pitLabel = label('PIT LANE', 0.7); pitLabel.position.set(0, 1.9, pitZ + pitDepth / 2 + 0.4); world.add(pitLabel);

  // ── здания ──
  const nb = buildings.length;
  walls = instanced(box, wallMat, nb, { windows: true });
  const crowns2 = buildings.filter(b => b.type === 'tower' && !b.tallest);
  const gables = buildings.filter(b => b.type === 'hut' || b.type === 'house');
  const slabs = buildings.filter(b => b.type === 'mid' || b.type === 'tower');
  const roofGable = instanced(gable, roofMat, gables.length);
  const roofSlab = instanced(box, roofMat, slabs.length);
  const crowns3 = instanced(box, wallMat, crowns2.length, { windows: true });
  const antennas = instanced(cyl, new THREE.MeshStandardMaterial({ color: '#8d939c', metalness: 0.8, roughness: 0.3 }), crowns2.length);
  const tips = instanced(sphere, new THREE.MeshStandardMaterial({ color: '#400', emissive: '#ff2a2a', emissiveIntensity: 1.4 }), crowns2.length);
  tips.castShadow = false;
  buildings.forEach((b, i) => {
    walls.setColorAt(i, b.wall);
    const a = walls.geometry.attributes;
    a.aCols.setXY(i, b.cols[0], b.cols[1]); a.aSeed.setX(i, b.seed);
  });
  gables.forEach((b, i) => roofGable.setColorAt(i, b.roof));
  slabs.forEach((b, i) => roofSlab.setColorAt(i, b.roof));
  crowns2.forEach((b, i) => { crowns3.setColorAt(i, b.wall.clone().multiplyScalar(0.8)); const a = crowns3.geometry.attributes; a.aCols.setXY(i, 2, 2); a.aSeed.setX(i, b.seed + 0.37); });
  for (const m of [walls, crowns3]) { m.geometry.attributes.aCols.needsUpdate = true; m.geometry.attributes.aSeed.needsUpdate = true; }
  world.add(walls, roofGable, roofSlab, crowns3, antennas, tips);
  wallsData = { gables, slabs, crowns2, roofGable, roofSlab, crowns3, antennas, tips };

  // вертолётная площадка на самом высоком здании
  if (tallest) {
    const pad = (() => {
      const c = document.createElement('canvas'); c.width = c.height = 128;
      const g = c.getContext('2d');
      g.fillStyle = '#2d2f35'; g.fillRect(0, 0, 128, 128);
      g.strokeStyle = '#ffd60a'; g.lineWidth = 7; g.beginPath(); g.arc(64, 64, 54, 0, Math.PI * 2); g.stroke();
      g.fillStyle = '#ffd60a'; g.font = '800 70px sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('H', 64, 68);
      const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
      return new THREE.Mesh(new THREE.CircleGeometry(0.4, 40), new THREE.MeshStandardMaterial({ map: t, roughness: 0.8 }));
    })();
    pad.rotation.x = -Math.PI / 2;
    world.userData.pad = pad; pad.visible = false;
    world.add(pad);
    heli.visible = true;
  } else heli.visible = false;

  // ── подписи месяцев вдоль северного тротуара ──
  const labelSize = Math.max(0.6, weeks * 0.024);
  let month = -1, lastWeek = -9;
  for (const cell of cells) {
    const m = new Date(cell.t).getUTCMonth();
    if (m !== month && (cell.dow === 0 || cell === cells[0])) {

      if (cell.week - lastWeek < 3) continue;
      lastWeek = cell.week;

  }

  // ── остров посреди океана, корабли и акулы ──
  const isl = buildIsland(xWest, xEast, zSouth, D, TRACK_W, hairpin ? HAIRPIN_X : 0);
  buildSea(isl);

  // ── свет, тень, камера ──
  const size = Math.max(W, D) / 2 + 12;
  sun.shadow.camera.left = -size; sun.shadow.camera.right = size; sun.shadow.camera.top = size; sun.shadow.camera.bottom = -size;
  sun.shadow.camera.near = 1; sun.shadow.camera.far = 400; sun.shadow.camera.updateProjectionMatrix();

  scene.fog.near = Math.max(120, dist * 0.8); scene.fog.far = Math.max(520, dist * 3);   // город большой: туман дальше

  if (q.get('cam')) { const [cx, cy, cz] = q.get('cam').split(',').map(Number); camera.position.set(cx, cy, cz); controls.autoRotate = false; if (q.get('tgt')) controls.target.set(...q.get('tgt').split(',').map(Number)); }

  $('range').textContent = `contributions · ${fmt(from, { month: 'short', day: 'numeric', year: 'numeric' })} – ${fmt(to, { month: 'short', day: 'numeric', year: 'numeric' })}`;
  $('active').textContent = active;

  $('streak').textContent = `${streak} ${streak === 1 ? 'day' : 'days'}`;
  $('from').value = iso(from); $('to').value = iso(to);
  history.replaceState(null, '', `?from=${iso(from)}&to=${iso(to)}`);

}

// ── день / ночь ──
function applyNight(n) {
  uNight.value = n; sky.material.uniforms.uNight.value = n;
  const sunDir = new THREE.Vector3().lerpVectors(new THREE.Vector3(0.55, 0.72, 0.42), new THREE.Vector3(-0.45, 0.62, -0.5), n).normalize();
  sky.material.uniforms.uSun.value.copy(sunDir);
  sun.position.copy(sunDir).multiplyScalar(120); sun.target.position.set(0, 0, 0);
  sun.intensity = mix(DAYS.sun, NIGHT.sun, n); sun.color.copy(DAYS.sunColor).lerp(NIGHT.sunColor, n);
  hemi.intensity = mix(DAYS.hemi, NIGHT.hemi, n); hemi.color.copy(DAYS.hemiSky).lerp(NIGHT.hemiSky, n); hemi.groundColor.copy(DAYS.hemiGround).lerp(NIGHT.hemiGround, n);
  renderer.toneMappingExposure = mix(DAYS.exposure, NIGHT.exposure, n);
  scene.fog.color.copy(DAYS.fog).lerp(NIGHT.fog, n);
  const isle = world.userData.islandMat;
  if (isle) isle.color.set('#3d7a38').lerp(new THREE.Color('#14301e'), n);
  const OU = oceanMat.uniforms;
  OU.uDeep.value.copy(OCEAN_DAY.deep).lerp(OCEAN_NIGHT.deep, n); OU.uShallow.value.copy(OCEAN_DAY.shallow).lerp(OCEAN_NIGHT.shallow, n);
  OU.uSkyHor.value.copy(OCEAN_DAY.hor).lerp(OCEAN_NIGHT.hor, n); OU.uSkyTop.value.copy(OCEAN_DAY.top).lerp(OCEAN_NIGHT.top, n);
  OU.uSunCol.value.copy(OCEAN_DAY.sun).lerp(OCEAN_NIGHT.sun, n); OU.uSunI.value = mix(OCEAN_DAY.sunI, OCEAN_NIGHT.sunI, n); OU.uSunDir.value.copy(sunDir);
  const fc = {}; scene.fog.color.getRGB(fc, THREE.SRGBColorSpace); sky.material.uniforms.uFog.value.set(fc.r, fc.g, fc.b);
  yachtGlass.emissive.set('#ffd27a'); yachtGlass.emissiveIntensity = n * 0.7;   // окна кораблей светятся ночью
  const bulbs = world.userData.bulbs, door = world.userData.doorMat;
  if (bulbs) bulbs.material.emissiveIntensity = n * 2.2;
  if (door) door.emissiveIntensity = n * 0.9;
  for (const c of cars) for (const m of c.mesh.userData.paint) m.emissiveIntensity = 0.12 + n * 0.5;   // днём чуть светится, чтобы цвет был сочнее
  trackMat.emissiveIntensity = n;
  barrierMat.emissive.set('#ffffff'); barrierMat.emissiveIntensity = n * 0.12;
  lineMat.emissive.set('#ffffff'); lineMat.emissiveIntensity = n * 0.25;
  rainLightMat.emissiveIntensity = 2 + n * 2;
}
let nightTarget = 1;

// ── анимация роста: здания растут этаж за этажом ──
function grow(now) {
  if (!anim || !walls) return;
  let done = true;
  const { gables, slabs, crowns2, roofGable, roofSlab, crowns3, antennas, tips } = wallsData;
  const a = walls.geometry.attributes;
  buildings.forEach((b, i) => {
    const p = Math.min(Math.max((now - anim.start - b.ids[0] * 1.2 - cells[b.ids[0]].week * (900 / anim.weeks)) / 900, 0), 1);
    if (p < 1) done = false;
    const e = 1 - Math.pow(1 - p, 3), h = Math.max(b.H * e, 0.001);
    dummy.rotation.set(0, 0, 0);
    dummy.position.set(b.x, 0.05, b.z); dummy.scale.set(b.w, h, b.d); dummy.updateMatrix(); walls.setMatrixAt(i, dummy.matrix);
    a.aFloors.setX(i, b.floors * e);
    b.top = 0.05 + h; b.e = e;
  });
  gables.forEach((b, i) => {
    const rh = b.type === 'hut' ? 0.34 : 0.5;
    dummy.position.set(b.x, b.top, b.z); dummy.scale.set(b.w * 1.16, rh * b.e, b.d * 1.16); dummy.updateMatrix(); roofGable.setMatrixAt(i, dummy.matrix);
  });
  slabs.forEach((b, i) => {
    dummy.position.set(b.x, b.top, b.z); dummy.scale.set(b.w + 0.08, 0.07 * b.e, b.d + 0.08); dummy.updateMatrix(); roofSlab.setMatrixAt(i, dummy.matrix);
  });
  const ca = crowns3.geometry.attributes;
  crowns2.forEach((b, i) => {
    const ch = 0.55 * b.e, y = b.top + 0.07 * b.e;
    dummy.position.set(b.x, y, b.z); dummy.scale.set(b.w * 0.6, ch, b.merged ? b.d * 0.8 : b.d * 0.6); dummy.updateMatrix(); crowns3.setMatrixAt(i, dummy.matrix);
    ca.aFloors.setX(i, 2 * b.e);
    dummy.position.set(b.x, y + ch, b.z); dummy.scale.set(0.03, 0.8 * b.e, 0.03); dummy.updateMatrix(); antennas.setMatrixAt(i, dummy.matrix);
    dummy.position.set(b.x, y + ch + 0.8 * b.e, b.z); dummy.scale.set(0.07, 0.07, 0.07); dummy.updateMatrix(); tips.setMatrixAt(i, dummy.matrix);
  });
  for (const m of [walls, roofGable, roofSlab, crowns3, antennas, tips]) m.instanceMatrix.needsUpdate = true;
  a.aFloors.needsUpdate = true; ca.aFloors.needsUpdate = true;
  // вертолёт и площадка на самом высоком здании
  const t = buildings.find(b => b.tallest);
  if (t && world.userData.pad) {
    const pad = world.userData.pad, top = t.top + 0.075;
    pad.visible = true; pad.position.set(t.x, top, t.z);
    heli.position.set(t.x, top, t.z); heli.rotation.y = 0.5;
    dummy.position.set(t.x, t.top, t.z); dummy.scale.set(t.w + 0.08, 0.07 * t.e, t.d + 0.08); dummy.updateMatrix();
    const slabIndex = wallsData.slabs.indexOf(t);
    if (slabIndex >= 0) { roofSlab.setMatrixAt(slabIndex, dummy.matrix); roofSlab.instanceMatrix.needsUpdate = true; }
  }
  if (done) anim = null;
}

// ── элементы управления ──
const presets = [['All time', 0], ['1Y', 365], ['6M', 182], ['3M', 91], ['1M', 30]];
function select(group, button) { for (const b of document.querySelectorAll('.seg button')) b.classList.toggle('on', b === button); }
for (const [name, days] of presets) {
  const b = document.createElement('button');
  b.textContent = name;
  b.onclick = () => { select('p', b); build(days ? Math.max(first, last - (days - 1) * DAY) : first, last); };
  $('presets').append(b);
}
for (let y = new Date(first).getUTCFullYear(); y <= new Date(last).getUTCFullYear(); y++) {
  const b = document.createElement('button');
  b.textContent = y;
  b.onclick = () => { select('y', b); build(Math.max(first, Date.UTC(y, 0, 1)), Math.min(last, Date.UTC(y, 11, 31))); };
  $('years').append(b);
}
function custom() {
  let a = parse($('from').value), b = parse($('to').value);
  if (isNaN(a) || isNaN(b)) return;
  if (a > b) [a, b] = [b, a];
  select(null, null);
  build(Math.max(first, a), Math.min(last, b));
}
$('from').onchange = $('to').onchange = custom;
$('spin').onclick = () => { controls.autoRotate = !controls.autoRotate; $('spin').classList.toggle('on', controls.autoRotate); };
function dayNightLabel() { $('dnIcon').textContent = nightTarget ? '🌙' : '☀️'; $('dnText').textContent = nightTarget ? 'Night' : 'Day'; }
$('daynight').onclick = () => { nightTarget = nightTarget ? 0 : 1; dayNightLabel(); };
controls.addEventListener('start', () => { controls.autoRotate = false; $('spin').classList.remove('on'); });
// зум полоской сбоку: вверх - ближе; шкала логарифмическая, чтобы и издалека, и вблизи двигалась ровно
const zoomT = d => Math.log(controls.maxDistance / d) / Math.log(controls.maxDistance / controls.minDistance);
function zoomTo(d) {
  d = Math.min(controls.maxDistance, Math.max(controls.minDistance, d));
  camera.position.sub(controls.target).setLength(d).add(controls.target);
  controls.update();
}
$('zbar').oninput = () => zoomTo(controls.maxDistance * (controls.minDistance / controls.maxDistance) ** ($('zbar').value / 1000));
$('zin').onclick = () => zoomTo(camera.position.distanceTo(controls.target) / 1.4);
$('zout').onclick = () => zoomTo(camera.position.distanceTo(controls.target) * 1.4);
controls.addEventListener('change', () => { if (document.activeElement !== $('zbar')) $('zbar').value = Math.round(zoomT(camera.position.distanceTo(controls.target)) * 1000); });

const q = new URLSearchParams(location.search);
if (q.get('day') === '1') { uNight.value = 0; nightTarget = 0; }
dayNightLabel();
if (q.get('from') && q.get('to')) {
  $('from').value = q.get('from'); $('to').value = q.get('to'); custom();
} else {
  const b = $('presets').children[1];
  select('p', b);
  build(Math.max(first, last - 364 * DAY), last);
}

// ── подсказка при наведении ──
const ray = new THREE.Raycaster(), pointer = new THREE.Vector2();
function hover(e) {
  if (!walls) return;
  pointer.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(pointer, camera);
  const hit = ray.intersectObject(walls)[0];
  const id = hit ? hit.instanceId : -1;
  if (hovered !== -1 && hovered !== id && buildings[hovered]) walls.setColorAt(hovered, buildings[hovered].wall);
  if (id !== -1) {
    const b = buildings[id];
    walls.setColorAt(id, new THREE.Color('#ffffff'));
    const dates = b.ids.map(k => fmt(cells[k].t, { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' })).join(' + ');
    $('tip').innerHTML = `<b>${b.c} ${b.c === 1 ? 'contribution' : 'contributions'}</b> · ${b.floors} ${b.floors === 1 ? 'floor' : 'floors'}<br>${dates}`;
    Object.assign($('tip').style, { left: e.clientX + 'px', top: e.clientY + 'px', opacity: 1 });
  } else $('tip').style.opacity = 0;
  if (walls.instanceColor) walls.instanceColor.needsUpdate = true;
  hovered = id;
}
renderer.domElement.addEventListener('pointermove', hover);
renderer.domElement.addEventListener('pointerleave', () => { $('tip').style.opacity = 0; });

placeTower();
addEventListener('resize', () => {
  placeTower();
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
let lastT = performance.now();
renderer.setAnimationLoop(now => {
  const dt = Math.min((now - lastT) / 1000, 0.05); lastT = now;
  if (Math.abs(uNight.value - nightTarget) > 0.001) { applyNight(uNight.value + Math.sign(nightTarget - uNight.value) * Math.min(dt * 1.6, Math.abs(nightTarget - uNight.value))); }
  grow(now);
  race(dt);
  updateTower(dt);
  oceanMat.uniforms.uTime.value = now / 1000; oceanMat.uniforms.uFogNear.value = scene.fog.far * 0.45; oceanMat.uniforms.uFogFar.value = scene.fog.far * 2.1;   // вода видна далеко, горизонт всё равно тонет в тумане
  bobYachts(now / 1000);
  sail_(now / 1000);
  heli.userData.rotor.rotation.y += dt * 24; heli.userData.tail.rotation.x += dt * 30;
  sky.position.copy(camera.position);
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
