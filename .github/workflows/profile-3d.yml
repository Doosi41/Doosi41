# Каждые 3 часа, при пуше в main и вручную (Actions → Run workflow):
# 1) рисует для README картинку коммитов — стопки шин Формулы 1 (scripts/tires.py),
# 2) выгружает историю коммитов для интерактивной 3D-страницы (docs/, GitHub Pages).
name: 3D contributions

on:
  schedule:
    - cron: "0 */3 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Export contribution history for the interactive page
        run: python3 scripts/contributions.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}

      - name: Tires picture for the README
        run: python3 scripts/tires.py

      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A profile-3d-contrib docs/data
          if git commit -m "Обновить 3D-график коммитов"; then
            git push
          fi
